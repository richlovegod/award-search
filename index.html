<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFCF6">
<meta name="color-scheme" content="light">
<!-- 加到主畫面: opens full screen with the mascot icon (a home-screen app keeps its own sign-in, separate from Safari) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機票研究所">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>吉諾機票研究所</title>
<meta name="description" content="哩程與機票探索實驗室">
<meta property="og:title" content="吉諾機票研究所">
<meta property="og:description" content="哩程與機票探索實驗室">
<meta property="og:image" content="https://award.ginochang.com/icons/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* Picture-book style, shared with the Nordic trip site: Huninn, warm paper, 3px ink outlines,
   coral / yellow / water / green fills. Huninn has a single weight, so hierarchy comes from size and fill, not bold. */
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --ink2:#6B6461;
  --coral:#F2A497; --yellow:#F6D27A; --water:#A8D3E6; --green:#B9DAA5;
  --coral-t:#FCE6E0; --yellow-t:#FCF1D3; --water-t:#E6F2F8; --green-t:#EBF4E5;
  --line:3px solid var(--ink); --r:22px;
  --star:var(--yellow); --oneworld:var(--coral); --skyteam:var(--water); --none:var(--green);
  --font:'Huninn','jf-openhuninn','PingFang TC','Microsoft JhengHei',sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --hh:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--paper)}
body{margin:0;font:16px/1.55 var(--font);color:var(--ink);background:var(--paper)}
b,strong,h1,h2,h3{font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button,a,summary,.switch{touch-action:manipulation}
button,summary,.switch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
a{color:var(--ink)}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* motion: one hop when results arrive, a floating mascot and plane; all off for reduced motion */
.float{animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift.d2{animation-duration:12s;animation-delay:-4s}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.flow{stroke-dasharray:6 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.sway{animation:sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .45s}

/* login */
.login{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.lcard{width:100%;max-width:360px;text-align:center}
.lcard .pic{border:var(--line);border-radius:26px;background:var(--water-t);padding:18px 0 8px;margin-bottom:16px;overflow:hidden}
.lcard .pic svg{width:150px;height:auto;margin:0 auto}
.lcard h1{font-size:27px;margin:0 0 2px}
.lcard .ltag{margin:0 0 10px;font-size:13px;color:var(--ink2);letter-spacing:.06em}
.lcard p{margin:0 0 14px;font-size:14px}
.lcard .err{min-height:22px;margin:10px 0 0;font-size:14px;color:#A33A2A}

/* sign in / sign up */
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.atabs button{border:var(--line);border-radius:999px;background:var(--paper);font-size:17px;padding:2px 0;transition:transform .12s ease-out}
.atabs button[aria-selected=true]{background:var(--coral)}
.atabs button:active{transform:scale(.96)}
.aform{border:var(--line);border-radius:var(--r);padding:14px;background:var(--yellow-t);text-align:left;display:grid;gap:10px}
.aform p{margin:0}
.aform .err{margin:0;min-height:0;text-align:center}
.aform .err:empty{display:none}
.pwf{padding-right:70px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;line-height:24px;padding:0 10px}
.hint{font-size:13px;color:var(--ink2)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:24px;height:24px;flex:0 0 24px;border:var(--line);border-radius:8px;background:var(--paper);display:grid;place-content:center}
.check input:checked+.box{background:var(--green)}
.check input:checked+.box::after{content:"";width:10px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.check input:focus-visible+.box{outline:3px solid var(--water);outline-offset:2px}
.abtn{border:var(--line);border-radius:999px;background:var(--coral);font-size:18px;padding:6px 0;transition:transform .12s ease-out}
.abtn:active{transform:scale(.97)}
.abtn[disabled]{opacity:.6}
.linkish{justify-self:center;border:0;background:none;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.rf-t{font-size:15px;text-align:center;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);border:var(--line);border-radius:999px;background:var(--green);padding:5px 18px;font-size:15px;text-align:center;animation:pop .35s var(--pop)}

/* my account and admin pages */
.vhead{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.vhead h2{flex:1;font-size:23px;margin:0}
.back{border:var(--line);border-radius:999px;background:var(--paper);padding:1px 12px;font-size:15px;text-decoration:none;white-space:nowrap;transition:transform .12s ease-out}
.back:active{transform:scale(.95)}
.acard{border:var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:12px 0;background:var(--paper)}
.acard.y{background:var(--yellow-t)}
.acard.w{background:var(--water-t)}
.acard.c{background:var(--coral-t)}
.acard h3{font-size:19px;margin:0 0 8px}
.acard form{display:grid;gap:10px}
.acard .btn{justify-self:start}
.note0{font-size:13px;color:var(--ink2);margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:2px dashed var(--ink);font-size:15px}
.kv span{color:var(--ink2);white-space:nowrap}
.kv b{text-align:right;word-break:break-all}
.acard .kv:last-of-type{margin-bottom:10px}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--ink)}
.rowi:last-of-type{border-bottom:0}
.rowi .main{flex:1;min-width:0}
.rowi .main b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:15px;word-break:break-all}
.rowi .main small{display:flex;flex-wrap:wrap;gap:0 12px;font-size:12px;color:var(--ink2)}
.rowi .icode{font-size:18px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.rowi .icode.old{font-size:13px;letter-spacing:0;font-weight:normal;color:var(--ink2)}
.rowi .who{display:block;font-size:14px;margin:1px 0 2px;word-break:break-all}
.rowi .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rowi .btn{font-size:13px;padding:1px 10px}
.rowi.col{flex-wrap:wrap}
.rowi.col .acts{flex-basis:100%;justify-content:flex-start}
.rowi .out{flex-basis:100%}
.rowi .out:empty{display:none}
.btn.ghost{background:var(--paper)}
.btn.warn{background:var(--coral)}
.tag.me,.tag.own{background:var(--yellow)}
.tag.off{background:var(--coral-t)}
.msg{font-size:14px;margin:0}
.msg:empty{display:none}
.msg.ok{color:#2F6B2F}
.msg.bad{color:#A33A2A}
.invnew{display:flex!important;align-items:flex-end;gap:8px}
.invnew .field{flex:1}
/* boarding-pass invite card: main part and a torn-off stub with the mascot, punched notches on the tear line */
.pass{display:flex;border:var(--line);border-radius:18px;background:var(--paper);margin:10px 0 8px;overflow:hidden;position:relative}
.pass-main{flex:1;min-width:0;padding:0 0 10px}
.pass-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;background:var(--yellow);border-bottom:var(--line);padding:5px 12px 4px}
.pass-h b{font-weight:normal;font-size:18px;letter-spacing:2px}
.pass-h span{font-size:11px;letter-spacing:2px;color:var(--ink2)}
.pass-row{display:flex;flex-wrap:wrap;gap:4px 16px;padding:8px 12px 0;font-size:15px}
.pass-row small,.pass-code small{display:block;font-size:11px;color:var(--ink2);letter-spacing:1px}
.pass-code{padding:8px 12px 0;font-size:24px;letter-spacing:3px;font-variant-numeric:tabular-nums;word-break:break-all}
.pass-stub{flex:0 0 84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-left:3px dashed var(--ink);background:var(--water-t);font-size:12px;text-align:center;line-height:1.3;padding:8px 4px}
.pass-stub svg{width:40px;height:40px}
.pass::before,.pass::after{content:'';position:absolute;right:73px;width:18px;height:18px;border:var(--line);border-radius:50%;background:var(--yellow-t)}
.pass::before{top:-12px}
.pass::after{bottom:-12px}
.pass-note{font-size:12px;color:var(--ink2);margin:6px 2px 4px}
.pass-msg{white-space:pre-wrap;word-break:break-word;font:13px/1.6 var(--font);background:var(--paper);border:2px dashed var(--ink);border-radius:14px;padding:8px 12px;margin:0}
.pass-acts{display:flex;gap:8px;margin:8px 0 4px}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:3px dashed var(--ink);border-radius:18px;padding:10px 12px;background:var(--paper);margin:10px 0}
.codebox .code{font-size:26px;letter-spacing:3px;font-variant-numeric:tabular-nums}
.codebox input{flex:1;min-width:0;font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;background:var(--paper)}
.codebox small{flex-basis:100%;font-size:12px;color:var(--ink2)}
/* 提醒: the form under the results, and the 我的提醒 page */
.alertf{display:grid;gap:10px}
.alertf h3,.alertf .note0{margin:0}
.alertf .af2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alertf .field input[type=date]{font-size:16px}
.alertf .field select{display:block;border:0;outline:0;width:100%;background:transparent;font:inherit;font-size:17px;padding:0;-webkit-appearance:none;appearance:none;color:inherit}
.alertf .lblx{font-size:12px;color:var(--ink2);margin:0 0 -4px}
.alertf .acts{display:flex;gap:8px}
.seg.two{grid-template-columns:1fr 1fr}
.seg.two button{font-size:14px;padding:4px 6px}
.seg.cab5 button{font-size:15px;padding:4px 0;min-height:36px}
html[lang=en] .seg.cab5 button{font-size:clamp(11px,3.4vw,15px)}
.mstate{font-size:15px;margin:0 0 10px}
.mstate.ok{color:#2F6B2F}
#mail-card .acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
details.guide{margin-top:8px;border-top:2px dashed var(--ink);padding-top:8px}
details.guide summary{cursor:pointer;font-size:14px}
details.guide ol{margin:8px 0;padding-left:22px;font-size:14px;line-height:1.6}
.arow .main small span+span::before{content:'・'}
.arow .main small{gap:0!important}
.arow .st{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
.arun{flex-basis:100%;border:2px dashed var(--ink);border-radius:14px;background:var(--paper);padding:6px 10px;font-size:13px}
.arun p{margin:0}
.arun ul{margin:4px 0 0;padding-left:18px}
.tag.pause{background:var(--yellow-t)}
details.danger summary{cursor:pointer;list-style:none;font-size:17px}
details.danger summary::-webkit-details-marker{display:none}
details.danger[open] summary{margin-bottom:8px}

/* 中文 / English: a small pill showing the other language */
.lang-btn{flex:0 0 auto;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;line-height:1.5;padding:1px 9px;min-height:30px;touch-action:manipulation}
.lang-btn:active{transform:scale(.95)}
.lcard{position:relative}
.lang-login{position:absolute;top:12px;right:12px}
/* in the header, top right (2026-10-15, Gino: "語言切換…擺在網站的最上面"): a round button the size the account
   button had there before it became the 我的 tab, so the title keeps its room */
.top .lang-top{width:38px;height:38px;min-height:0;padding:0;border:var(--line);border-radius:50%;display:grid;place-items:center;font-size:13px;line-height:1;transition:transform .12s ease-out}
.top .lang-top:active{transform:scale(.92)}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-top:7px solid var(--water);border-bottom:var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left))}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-size:19px;min-width:0;white-space:nowrap;color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
.brand:active .logo{transform:scale(.92)}
.brand .logo{width:38px;height:38px;flex:0 0 38px}
/* today's seats.aero calls: 已用 XXX/1000 over a bar (green, yellow from 70%, coral from 90%) */
.quota{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:92px;border:2px solid var(--ink);border-radius:12px;padding:2px 8px 5px;background:var(--paper);white-space:nowrap;font-size:12px;line-height:1.2;text-align:left;transition:transform .12s ease-out}
.quota:active{transform:scale(.95)}
.quota .qt b{font-weight:normal;font-size:14px;font-variant-numeric:tabular-nums}
.qbar{display:block;height:8px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.qbar i{display:block;width:0;height:100%;background:var(--green);transition:width .5s var(--pop)}
.quota.warn .qbar i{background:var(--yellow)}
.quota.bad .qbar i{background:var(--coral)}
@media (max-width:359px){.brand span{display:none}}
.icon-btn{border:var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;transition:transform .12s ease-out}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px}

/* search card */
.card{background:var(--paper);border:var(--line);border-radius:var(--r);padding:12px 12px 36px;margin:14px 0 36px;position:relative}
.hero{border:var(--line);border-radius:16px;background:var(--water-t);overflow:hidden;margin-bottom:10px}
.hero svg{width:100%;height:auto}
/* the route row and the date row share one 3-column grid, so 出發 sits over 最早出發 and 抵達 over 最晚出發 */
.route{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:6px;align-items:stretch}
.field{position:relative;border:var(--line);border-radius:16px;padding:4px 10px 5px;min-width:0;background:var(--paper)}
.field:focus-within{background:var(--water-t)}
.field label{display:block;font-size:12px;color:var(--ink2);line-height:1.35}
.field input{display:block;border:0;outline:0;width:100%;min-width:0;padding:0;background:transparent;font-size:17px;-webkit-appearance:none;appearance:none;border-radius:0}
.ap input{font-size:clamp(18px,5.6vw,24px);line-height:1.3;text-transform:uppercase;letter-spacing:.5px}
.ap input::placeholder{font-size:16px;letter-spacing:0;text-transform:none;color:#A39C98}
.names{font-size:12px;color:var(--ink2);height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 交換 (2026-10-14 redesign): the word itself, no arrows and never yellow, so it can't read as 來回 the way the
   old yellow ⇄ did; paper with an ink ring like the account button, an action with no on/off look */
.swap{align-self:center;justify-self:center;width:46px;height:46px;border-radius:50%;border:var(--line);background:var(--paper);color:var(--ink);font-size:14px;letter-spacing:1px;line-height:1;padding:0 0 0 1px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .12s ease-out}
.swap:active{transform:scale(.9)}
.swap:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
@media (hover:hover){.swap:hover{background:var(--water-t)}}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.ap{cursor:text}
.tt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:240px;margin:0 auto 10px}
.tt button{border:var(--line);border-radius:999px;background:var(--paper);font-size:16px;padding:6px 0;transition:transform .12s ease-out}
.tt button:active{transform:scale(.95)}
.tt button[aria-checked=true]{background:var(--yellow)}
/* round trip: one tab per direction, with each direction's lowest miles */
.legs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.legs button{border:var(--line);border-radius:16px;background:var(--paper);text-align:left;padding:5px 10px 6px;line-height:1.3;min-width:0}
.legs button[aria-selected=true]{background:var(--water)}
.legs button b{display:block;font-size:15px;font-weight:normal;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs small{display:block;font-size:12px;color:var(--ink2)}
.legs .sum2{grid-column:1/-1;font-size:14px;margin:0 2px}
/* 多城市: each extra leg under the first one (the main route and date rows are leg 1) */
.tt{grid-template-columns:repeat(3,minmax(0,1fr));max-width:340px}
html[lang=en] .tt button{font-size:clamp(13px,4vw,16px)}
.mlegs{margin-top:4px}
.mleg{margin-top:12px;padding-top:8px;border-top:2px dashed var(--ink)}
.mhead{display:flex;align-items:center;justify-content:space-between;font-size:14px;margin-bottom:6px}
.mdel{border:2px solid var(--ink);border-radius:999px;background:var(--paper);min-width:36px;min-height:32px;font-size:14px}
.mroute{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:6px;align-items:stretch}
.mroute .mto{align-self:center;text-align:center;font-size:18px}
.mleg .dates{margin-top:6px}
.madd{margin-top:12px;font-size:14px}
/* 日期組合: the cheapest outbound + return pairs, and a grid for short ranges */
.legs .cmb-btn{grid-column:1/-1;justify-self:start;font-size:13px;padding:1px 12px}
.legs .cmb-btn[aria-expanded=true]{background:var(--yellow)}
.cmb{grid-column:1/-1;border:var(--line);border-radius:var(--r);background:var(--paper);padding:8px 10px 10px}
.cmb .lbl{margin:2px 0 6px}
.combos{display:grid;gap:6px}
.combo{display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline;text-align:left;border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:5px 10px;line-height:1.35}
.combo b{font-weight:normal;font-size:16px;white-space:nowrap}
.combo small{grid-column:1/-1;font-size:12px;color:var(--ink2)}
.combo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.combo.on{background:var(--yellow-t)}
.cgrid-wrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
.cgrid{border-collapse:separate;border-spacing:3px;font-size:12px}
.cgrid th{font-weight:normal;color:var(--ink2);white-space:nowrap;padding:0 2px}
.cgrid td button{border:2px solid var(--ink);border-radius:9px;background:var(--paper);min-width:42px;padding:3px 2px;font-size:12px}
.cgrid td.good button{background:var(--green-t)}
.cgrid td.best button{background:var(--green)}
.cgrid td.x{background:none}
.switch.opt{margin:6px 0}
.switch.opt small{display:block;font-size:11px;color:var(--ink2)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--paper);border:var(--line);border-radius:18px;z-index:15;max-height:300px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:pop .3s var(--pop)}
.sugg button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:2px dashed var(--ink)}
.sugg button:last-child{border-bottom:0}
.sugg button:active{background:var(--yellow-t)}
.sugg b{flex:0 0 auto;min-width:76px;font-size:15px;letter-spacing:.5px}
.sugg span{color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:grid;grid-template-columns:minmax(0,1fr) 48px minmax(0,1fr);gap:6px;margin-top:8px}
.dates .to{align-self:center;text-align:center;font-size:15px}
/* 320px phones: a slimmer middle column and gaps, so 去程最早 2027 still fits on one line */
@media (max-width:359px){
  .route,.dates{grid-template-columns:minmax(0,1fr) 44px minmax(0,1fr);gap:4px}
  .swap{width:44px;height:44px;font-size:13px;letter-spacing:0}
}
/* the date fields show a short "11/1 (日)" label; the real date input sits on top, invisible, so a tap opens the iPhone picker */
.df{cursor:pointer}
.df label small{font-size:11px;margin-left:4px}
.df .dv{display:block;font-size:clamp(16px,5vw,19px);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
input[type=date]{min-height:26px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.months{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;margin:6px 0 0;padding:4px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.months::-webkit-scrollbar{display:none}
/* chips draw at about 36px and take taps over 44px */
.mchip{position:relative;flex:0 0 auto;min-width:66px;text-align:center;border:var(--line);border-radius:999px;background:var(--paper);padding:4px 12px;font-size:15px;line-height:1.35;white-space:nowrap;touch-action:manipulation;transition:transform .12s ease-out}
.mchip::after{content:'';position:absolute;inset:-4px -2px}
/* the return leg: its own dates, and 待多久 = the outbound range moved 1 to 4 weeks later */
.leg{margin-top:14px}
.leg .dates{margin-top:0}
.qrow{display:flex;align-items:center;gap:8px;margin-top:6px}
.ql{flex:0 0 auto;font-size:13px;color:var(--ink2)}
.stays{flex:1;min-width:0;display:flex;gap:6px}
.stays .mchip{flex:1 1 0;min-width:0;max-width:84px;padding:4px 4px}
.mchip:active{transform:scale(.95)}
.mchip small{font-size:11px;margin-right:3px;color:var(--ink2)}
.mchip.on{background:var(--yellow)}
.ferr{color:#A33A2A;font-size:14px;margin:8px 0 0}
.ferr:empty{display:none}
/* 46px tall and 24.5px below the padding edge, so its middle sits on the middle of the card's 3px bottom border */
.go{position:absolute;left:50%;bottom:-24.5px;height:46px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;border:var(--line);border-radius:999px;background:var(--coral);font-size:19px;line-height:1;padding:0 26px 0 20px;white-space:nowrap;transition:transform .12s ease-out}
.go:active{transform:translateX(-50%) scale(.95)}
.go[disabled]{background:var(--coral-t)}
.go svg{width:22px;height:22px}

/* recent searches */
.recent{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;margin:-8px -14px 8px;padding:0 14px 4px;scrollbar-width:none}
/* These rows swipe sideways on a phone. With a mouse there is no swipe and the hidden scrollbar leaves no way
   across (Gino, 2026-10-14: only half of 6 月 showed), so on a computer the chips wrap onto more lines instead. */
@media (hover:hover) and (pointer:fine){
  .months,.recent{flex-wrap:wrap;overflow-x:visible}
  .recent{margin-left:0;margin-right:0;padding-left:0;padding-right:0}
}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;border:2px dashed var(--ink);border-radius:999px;background:var(--paper);font-size:13px;padding:2px 12px;white-space:nowrap}
.recent button:active{background:var(--yellow-t)}

/* results */
#results{scroll-margin-top:calc(var(--hh) + 6px);animation:pop .5s var(--pop)}
#banner.sticky{position:sticky;top:var(--hh);z-index:6;background:var(--paper);padding-top:4px}
.banner{border:var(--line);border-radius:18px;padding:10px 14px;margin:10px 0;background:var(--yellow-t);font-size:14px}
.banner.bad{background:var(--coral-t)}
.banner.demo{display:flex;align-items:center;gap:8px;margin:4px 0 6px;padding:6px 10px;background:var(--yellow)}
.banner.demo .acts{margin:0 0 0 auto;flex:0 0 auto}
.banner.demo .btn{margin:0;padding:1px 12px}
.demo-on .dh{top:calc(var(--hh) + var(--bh,0px))}
.banner b{display:block;font-size:17px;margin-bottom:2px}
.banner.demo b{display:inline;font-size:15px;margin:0 6px 0 0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;border:var(--line);border-radius:999px;background:var(--water);padding:3px 14px;font-size:15px;text-decoration:none;transition:transform .12s ease-out}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--coral)}
.route-h{font-size:30px;letter-spacing:1px;line-height:1.2;margin:8px 0 2px;overflow-wrap:anywhere}
.route-h .ar{display:inline-block;width:34px;height:22px;margin:0 6px;vertical-align:-1px}
.sum{font-size:15px}
.fresh{font-size:12px;color:var(--ink2);margin:2px 0 0}
.fresh:empty{display:none}

/* filters: they work on rows already downloaded, so changing them costs no API call */
.filters{border:var(--line);border-radius:var(--r);padding:12px;margin:12px 0 16px;background:var(--green-t)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:var(--line);border-radius:16px;background:var(--paper);padding:4px 0 3px;line-height:1.3;font-size:16px;transition:transform .12s ease-out}
.seg button:active{transform:scale(.95)}
.seg button[aria-checked=true]{background:var(--coral)}
.seg .n{display:block;font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:var(--line);border-radius:999px;background:var(--paper);padding:1px 11px;font-size:15px;transition:transform .12s ease-out}
.chip:active{transform:scale(.95)}
.chip .dot{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--yellow)}
.al4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.al4 .chip{justify-content:center;padding:2px 4px;white-space:nowrap;opacity:.55}
.al4 .chip[aria-pressed=true]{background:var(--c);opacity:1}
.al4 .chip[aria-pressed=true] .dot{background:var(--paper)}
.al4 .chip[aria-pressed=false] .dot{background:var(--c)}
.al4 .chip.part{opacity:1;border-style:dashed;background:var(--paper)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.switch{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:26px;border:var(--line);border-radius:999px;background:var(--paper);position:relative;flex:0 0 46px;transition:background .2s}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .25s var(--pop)}
.switch input:checked+.tr{background:var(--green)}
.switch input:checked+.tr::after{transform:translateX(20px)}
.switch input:focus-visible+.tr{outline:3px solid var(--water);outline-offset:2px}
details.progs{margin-top:12px;border:var(--line);border-radius:18px;background:var(--paper)}
details.progs summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:15px;cursor:pointer}
details.progs summary::-webkit-details-marker{display:none}
details.progs summary::after{content:"＋";margin-left:4px}
details.progs[open] summary::after{content:"－"}
details.progs summary #prog-sum{margin-left:auto;color:var(--ink2);font-size:13px;text-align:right}
.pl{padding:0 12px 12px}
.pl .field{margin:2px 0 4px}
.tfh{font-size:15px;margin:12px 0 0;padding-top:8px;border-top:2px dashed var(--ink)}
.tfh:first-child{border-top:0;padding-top:0;margin-top:4px}
#tf .lbl{margin:10px 0 4px}
#tf .chip{font-size:14px;padding:0 10px}
#tf .chip small{font-size:11px;margin-left:3px;color:var(--ink2)}
#tf .chip[data-tf=noVia][aria-pressed=true]{background:var(--coral-t);text-decoration:line-through}
.tfc{margin:6px 0 2px;font-size:13px;padding:1px 12px}
/* 金額 US$ | NT$ */
.dseg{display:inline-flex;align-items:center;gap:4px;margin-left:auto;font-size:13px}
.dseg button{border:2px solid var(--ink);border-radius:999px;background:var(--paper);padding:0 9px;font-size:13px;line-height:1.6}
.dseg button[aria-pressed=true]{background:var(--water)}
.kv .dseg{margin-left:0}
/* which bank points reach the program: one line on the card, the points needed in the details */
.o5{display:block;font-size:12px;color:var(--ink2);margin-top:3px;white-space:normal}
.o5 .xi{white-space:nowrap}
.xfer{margin-top:10px;padding-top:10px;border-top:2px dashed var(--ink)}
.xfer>b{font-weight:normal;font-size:15px}
.xfer ul{list-style:none;margin:6px 0 4px;padding:0}
.xfer li{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;padding:3px 0}
.xfer .xb{min-width:88px;font-size:14px}
.xfer .xn{font-size:16px;font-variant-numeric:tabular-nums}
.xfer .xr{font-size:12px;color:var(--ink2)}
.xfer li small{flex-basis:100%;font-size:11px;color:var(--ink2);padding-left:98px}
@media (max-width:359px){.xfer li small{padding-left:0}}
.xfer .note0{font-size:11px;margin:4px 0 0}
/* 即時核對 at the top of a card's details */
.verify{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 0 10px;border-bottom:2px dashed var(--ink);margin-bottom:4px}
.verify .vage{font-size:14px}
.verify small{flex-basis:100%;font-size:12px;color:var(--ink2)}
.verify .btn{font-size:14px;padding:2px 14px;background:var(--yellow-t)}
.cash{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--ink)}
.cpp{display:inline-flex;align-items:center;gap:4px;font-size:14px}
.cpp input{width:7.5em;box-sizing:border-box;font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:1px 6px;background:var(--paper)}
.cppv{font-size:14px;flex-basis:100%}
.cppv:empty{display:none}
.pgh{display:flex;align-items:center;gap:6px;font-size:13px;margin:12px 0 4px}
.pgh .dot{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--c)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}
.pi{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0;min-width:0}
.pi input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border:var(--line);border-radius:7px;margin:0;display:grid;place-content:center;background:var(--paper);cursor:pointer}
.pi input:checked{background:var(--green)}
.pi input:checked::after{content:"";width:9px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.pi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pi em{font-style:normal;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 6px;background:var(--green);line-height:1.3}
.pi em:empty{display:none}

/* calendar: the one bold element of the page */
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 18px;margin:4px 0 6px}
.mh{font-size:18px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;text-align:center;padding-bottom:2px}
.day{border:2px solid var(--ink);border-radius:12px;min-height:48px;padding:3px 0 2px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;position:relative;line-height:1.2;min-width:0;transition:transform .12s ease-out}
.day:active{transform:scale(.92)}
.day .dn{font-size:12px;font-variant-numeric:tabular-nums}
.day .dm{font-size:13px;white-space:nowrap;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.day.none{border:2px dashed #CFC8C3;color:var(--ink2)}
.day.good{background:var(--green-t)}
/* every cell keeps a 2px border so the numbers in a row line up; emphasis is drawn inside with a shadow */
.day.best{background:var(--green);box-shadow:inset 0 0 0 1px var(--ink)}
.day.dir::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day.sel{background:var(--coral);box-shadow:inset 0 0 0 1px var(--ink);animation:pop .35s var(--pop)}
.day.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:6px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);border-radius:4px;vertical-align:-3px;margin-right:4px}
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;font-size:14px}
.sortbar .chip{padding:0 10px;font-size:14px}
.sortbar .chip[aria-pressed=true]{background:var(--water)}
.dayf{background:var(--coral)!important}

/* list of offers */
.dh{position:sticky;top:var(--hh);z-index:4;background:var(--paper);margin:0;padding:12px 2px 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.dh::before{content:"";width:14px;height:14px;flex:0 0 14px;border:3px solid var(--ink);border-radius:50%;background:var(--water)}
.offer{border:var(--line);border-radius:18px;margin:8px 0;background:var(--paper);overflow:hidden}
.ohead{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px 9px}
.ohead:active{background:var(--yellow-t)}
.o1,.o2,.o3,.o4{display:flex;align-items:baseline;gap:6px;min-width:0}
/* small square airline logos (Google Flights' public image folder) */
.lg{display:inline-block;width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px;flex:0 0 16px;align-self:center}
.o1 .lg{width:18px;height:18px;flex-basis:18px;margin:0}
.o4{font-size:14px;margin-top:3px;flex-wrap:wrap;row-gap:2px;font-variant-numeric:tabular-nums}
.o4 b{font-weight:normal;font-size:16px;letter-spacing:.3px}
.o4 sup{font-size:10px;margin-left:1px}
.o4 .du,.o4 .via{color:var(--ink2);font-size:13px}
.o4 .more{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
/* on a narrow phone the Chinese name gives way first, then the program name; the miles always stay inside the card */
.o1 .pn{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:2.5em;flex:0 1 auto}
.o1 .pz{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 30 auto}
.al{flex:0 0 auto;font-size:12px;border:2px solid var(--ink);background:var(--c);border-radius:999px;padding:0 7px;line-height:1.35;align-self:center}
.mi{margin-left:auto;font-size:23px;white-space:nowrap;letter-spacing:-.2px;font-variant-numeric:tabular-nums;background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 2px}
.mi small{font-size:13px;margin-left:2px}
.o2{font-size:14px;margin-top:3px;flex-wrap:wrap;row-gap:3px}
.o2 .rt{letter-spacing:.5px}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--paper);font-size:12px;line-height:20px}
.tag.d{background:var(--green)}
.tag.nw{background:var(--yellow)}
.tag.dn{background:var(--coral-t)}
/* 收藏 on the home page, and the save button under the route */
.saved{margin:-8px 0 14px}
.saved h3{font-size:15px;font-weight:normal;margin:0 0 6px}
.sv{display:flex;gap:6px;margin:0 0 6px}
.svgo{flex:1;min-width:0;text-align:left;border:var(--line);border-radius:14px;background:var(--paper);padding:5px 12px;font-size:14px;line-height:1.35}
.svgo small{display:block;font-size:11px;color:var(--ink2)}
.svx{flex:0 0 38px;border:var(--line);border-radius:14px;background:var(--paper);font-size:15px}
.saverow{margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:6px}
.saverow .btn{font-size:13px;padding:1px 12px}
.saverow .btn[aria-pressed=true]{background:var(--yellow)}
.tx{margin-left:auto;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.tx .fx{font-size:11px;color:var(--ink2);margin-left:4px}
.o3{font-size:12px;color:var(--ink2);margin-top:4px}
.o3 .ca{flex:1;min-width:0}
.o3 .fl{white-space:nowrap}
.o3 .age{white-space:nowrap}
.o3 .chev{width:18px;height:18px;flex:0 0 18px;transition:transform .25s var(--pop);align-self:center;color:var(--ink)}
.ohead[aria-expanded=true] .chev{transform:rotate(180deg)}
.trips{border-top:var(--line);background:var(--water-t);padding:4px 12px 12px;font-size:14px;animation:pop .35s var(--pop)}
.trip{padding:10px 0;border-bottom:2px dashed var(--ink)}
.t1{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;font-size:15px}
.t1 b{font-size:20px;font-variant-numeric:tabular-nums}
.t1 .ap3{font-size:14px;letter-spacing:.5px}
.t1 sup{font-size:11px;color:#A33A2A}
.t1 .t-mi{flex-basis:100%;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
.t2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:3px}
.t2 .fn{letter-spacing:.5px}
.segs{margin:8px 0 0 6px;border-left:3px dotted var(--ink);padding-left:12px}
.sg{margin:4px 0}
.sg1{font-size:14px;font-variant-numeric:tabular-nums}
.sg1 b{margin-right:8px}
.sg2{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;color:var(--ink2)}
.lay{display:inline-block;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--coral-t);margin:6px 0}
.book{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tload,.tnone,.terr,.tmore{padding:10px 0}
.terr{color:#A33A2A}
.empty{border:3px dashed var(--ink);border-radius:var(--r);padding:14px 16px 16px;text-align:center;background:var(--green-t);margin:8px 0}
.empty svg{width:54px;height:54px;margin:0 auto 6px}
.empty .chips{justify-content:center;margin-top:10px}
.more-btn{display:block;margin:14px auto;border:var(--line);border-radius:999px;background:var(--water);padding:3px 18px;font-size:15px;transition:transform .12s ease-out}
.more-btn:active{transform:scale(.95)}
.skel{height:78px;border:3px dashed #CFC8C3;border-radius:18px;margin:8px 0;background:linear-gradient(90deg,var(--paper) 25%,var(--yellow-t) 37%,var(--paper) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.note{font-size:12px;color:var(--ink2);margin:16px 0 0}
@media (hover:hover) and (pointer:fine){
  .sugg button:hover,.ohead:hover{background:var(--yellow-t)}
  .chip:hover,.mchip:hover,.recent button:hover{background:var(--yellow-t)}
  .btn:hover,.more-btn:hover,.go:hover{filter:brightness(1.04)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.route-h .ar svg{width:100%;height:100%}
/* ---------- the tab bar (機票 探索 飯店 提醒 我的), fixed at the bottom; it slides away while typing ---------- */
:root{--tabh:58px;--sab:env(safe-area-inset-bottom,0px);--barh:calc(var(--tabh) + 3px + var(--sab))}
html.has-bar{scroll-padding-bottom:calc(var(--barh) + 8px)}
html.has-bar .wrap{padding-bottom:calc(var(--barh) + 28px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:var(--line);
  padding:0 env(safe-area-inset-right,0px) var(--sab) env(safe-area-inset-left,0px);transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear 0s}
.tabbar ul{list-style:none;margin:0 auto;padding:0 2px;max-width:560px;display:grid;grid-template-columns:repeat(var(--tabs,5),minmax(0,1fr))}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--tabh);
  color:var(--ink2);text-decoration:none;font-size:12px;line-height:1.2;white-space:nowrap;
  touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab .ti{position:relative;display:grid;place-items:center;width:54px;height:32px;border:2.5px solid transparent;border-radius:999px;transition:transform .12s ease-out}
.tab svg{width:26px;height:26px}
.tab:active .ti{transform:scale(.9)}
.tab .tl{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tab[aria-current=page]{color:var(--ink)}
.tab[aria-current=page] .ti{background:var(--yellow);border-color:var(--ink);animation:pop .3s var(--pop)}
.tab:focus-visible{outline:none}
.tab:focus-visible .ti{outline:3px solid var(--water);outline-offset:2px}
.tab .k0{fill:var(--paper)}
.tab .k1,.tab .k2{fill:var(--paper);transition:fill .2s}
.tab[aria-current=page] .k1{fill:var(--c1)}
.tab[aria-current=page] .k2{fill:var(--c2)}
html.kb .tabbar{transform:translateY(100%);visibility:hidden;transition:transform .18s ease-in,visibility 0s linear .18s}
@media (orientation:landscape) and (max-height:500px){
  :root{--tabh:44px}
  .tab{flex-direction:row;gap:6px}
  .tab .ti{width:44px;height:28px}
  .tab svg{width:22px;height:22px}
}
/* wide screens: a dock in the middle of the bottom edge, labels beside the icons */
@media (min-width:900px){
  .tabbar{left:50%;right:auto;width:600px;margin-left:-300px;border:var(--line);border-bottom:0;border-radius:22px 22px 0 0}
  .tab{flex-direction:row;gap:6px;font-size:15px}
  .tab .ti{width:46px;height:30px}
  .tab svg{width:23px;height:23px}
}
@media (hover:hover) and (pointer:fine){
  .tab:hover{color:var(--ink)}
  .tab:not([aria-current=page]):hover .ti{background:var(--yellow-t);border-color:var(--ink)}
}
/* the toast: centred with auto margins (the pop animation moves it too), above the bar or the keyboard, never in the way of a tap */
.toast{left:0;right:0;margin:0 auto;width:max-content;max-width:min(440px,calc(100% - 32px));transform:none;border-radius:22px;line-height:1.45;pointer-events:none}
html.has-bar .toast{bottom:calc(var(--barh) + 12px)}
html.kb .toast{bottom:calc(var(--kbh,0px) + 12px)}
/* 我的: the list of its pages */
.hub{padding:4px 14px}
.hubrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:2px dashed var(--ink);text-decoration:none;color:var(--ink);min-height:48px}
.hubrow:last-child{border-bottom:0}
.hubrow .hi{flex:0 0 38px;height:38px;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:12px;background:var(--water-t)}
.hubrow .hi svg{width:24px;height:24px}
.hubrow .hl{flex:1;min-width:0;font-size:16px}
.hubrow .hl small{display:block;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hubrow .hc{font-size:20px;color:var(--ink2)}
.kv b.em{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* line icons on the result tools */
.saverow .btn{display:inline-flex;align-items:center;gap:5px}
.bi{width:16px;height:16px;flex:0 0 16px}
.saverow .btn[aria-pressed=true] .bi path{fill:var(--yellow)}
.vhead h2:focus{outline:none}
/* English runs wider than Chinese: words in fixed boxes get smaller type, and a long title ends in … */
.brand span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand .bt{display:flex;flex-direction:column;line-height:1.2}
.brand .bs{font-size:11px;color:var(--ink2);letter-spacing:.06em;margin-top:2px}
html[lang=en] .brand .bs{font-size:10.5px;letter-spacing:0}
/* measured 2026-10-16 with a three-digit meter (Used 141/1,000): the English tagline needs 414 px, the English title
   16.5 px type below 390 and 15 px below 375; the Chinese title gets 17.5 px below 375. Below 359 px only the logo shows. */
@media (max-width:413px){html[lang=en] .brand .bs{display:none}}
@media (max-width:389px){html[lang=en] .brand .bn{font-size:16.5px}}
@media (max-width:374px){.brand .bn{font-size:17.5px} html[lang=en] .brand .bn{font-size:15px}}
@media (max-width:359px){.brand .bt{display:none}}
html[lang=en] .seg button{font-size:clamp(12px,3.7vw,16px)}

  const [b, m] = r;
  if (bank === 'marriott') {
    const bonus = src === 'united' ? 10000 : ['american', 'delta', 'lifemiles'].includes(src) ? 0 : 5000;
    for (let p = 3000; p <= 6000000; p += 3000) if (Math.floor(p * m / b) + Math.floor(p / 60000) * bonus >= miles) return p;

  return Math.ceil(miles * b / m / inc) * inc;

// The static HTML is written in Chinese: in English its text nodes and placeholder / aria-label / title attributes
// are swapped from EN. Each swap remembers [the Chinese, what it wrote], so switching back restores the Chinese,
// and a node or attribute that code has rewritten since (the meter's label, for one) is taken as it is now, not
// put back. Everything rendered by code uses t(), so switching re-renders those parts.
const ZH_TEXT = new WeakMap(), ZH_ATTR = new WeakMap();
const HAS_CJK = /[\u3400-\u9fff\uff00-\uffef]/;
// the Chinese to translate from: the recorded one while the value is still what was written, else the value
// itself if it is Chinese; null (leave it alone) for English or neutral text that code set
const zhSource = (rec, v) => (rec && v === rec[1] ? rec[0] : HAS_CJK.test(v) ? v : null);
function translateStatic() {
  const walk = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  for (let nd = walk.nextNode(); nd; nd = walk.nextNode()) {
    const zh = zhSource(ZH_TEXT.get(nd), nd.nodeValue);
    if (zh == null) continue;
    const key = zh.trim();
    nd.nodeValue = LANG === 'en' && EN[key] != null ? zh.replace(key, EN[key]) : zh;
    ZH_TEXT.set(nd, [zh, nd.nodeValue]);
  }
  for (const el of document.querySelectorAll('[placeholder],[aria-label],[title]')) {
    const recs = ZH_ATTR.get(el) || {};
    for (const at of ['placeholder', 'aria-label', 'title']) {
      if (!el.hasAttribute(at)) continue;
      const zh = zhSource(recs[at], el.getAttribute(at));
      if (zh == null) continue;
      el.setAttribute(at, LANG === 'en' && EN[zh] != null ? EN[zh] : zh);
      recs[at] = [zh, el.getAttribute(at)];
    }
    ZH_ATTR.set(el, recs);
  }
}

/* ---------- API ---------- */
class ApiError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }
// GET a relay path, or POST `payload` as JSON (only /refresh does)
async function api(path, payload) {
  const sent = getToken();
  let r;
  try {
    r = await fetch(RELAY + path, payload === undefined ? { headers: { Authorization: 'Bearer ' + sent } }
      : { method: 'POST', headers: { Authorization: 'Bearer ' + sent, 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  } catch {
    throw new ApiError('network', t('連不上中繼站，請檢查網路後再試一次。'));
  }
  const q = r.headers.get('X-RateLimit-Remaining');
  if (q !== null && q !== '' && !isNaN(q)) setQuota(Number(q), Number(r.headers.get('X-RateLimit-Limit')) || 1000, Date.now());
  if (q !== null) meqSoon();   // a real seats.aero call: an invited account's own count changed
  const text = await r.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (r.ok) {
    if (!ME) recheckMe();   // (as in call())
    if (!body) throw new ApiError('bad', t('seats.aero 回傳的資料看不懂，等一下再試。'));
    return body;
  }
  if (body && body.error === 'auth') { if (sent && sent === getToken()) logout(t(ERR.auth), false); throw new ApiError('auth', t(ERR.auth)); }   // (as in call())
  if (body && body.error === 'param') throw new ApiError('param', t('搜尋條件的格式不對。'));
  // the account's own daily budget, or the reserve kept for the owner (see the Worker's budgetCheck)
  if (body && body.error === 'user_quota') throw new ApiError('quota', t('你今天的 {0} 次額度用完了，{1}重置。', body.limit, resetText()));
  if (body && body.error === 'reserve') throw new ApiError('quota', t('今天整個網站的額度快用完了，剩下的先留給管理員，{0}重置。', resetText()));
  const lower = text.toLowerCase();
  if (lower.includes('subscription_expired')) throw new ApiError('expired', t('seats.aero 的 Pro 訂閱已經過期，續訂之後才查得到。'));

/* ---------- cache ---------- */
const MEM = new Map();
function cacheGet(k) {
  let v = MEM.get(k);
  if (!v) { try { v = JSON.parse(sessionStorage.getItem(k)); } catch {} }
  if (v && Date.now() - v.t < CACHE_MIN * 60000) { MEM.set(k, v); return v; }
  return null;
}
// sessionStorage holds about 5 MB and a month of TPE-SEA is about 2.5 MB, so a new entry first clears out expired ones,
// then, while it still doesn't fit, the oldest ones that are not part of the search on screen. Each entry starts
// {"t":<ms>, so its age is read without parsing megabytes of rows.
// cacheSweep() clears out the expired ones (from memory too) and returns the others, oldest first, as [key, t]. It also
// runs once each entry has expired, and at startup, so dead results don't keep the room the 飯店 results need.
function cacheSweep() {
  const now = Date.now(), live = at => now - at < CACHE_MIN * 60000, kept = [];
  for (const [x, c] of MEM) if (!live(c.t)) MEM.delete(x);
  try {
    const old = [];
    for (let i = 0; i < sessionStorage.length; i++) { const x = sessionStorage.key(i); if (x && x.startsWith('award-c:')) old.push(x); }
    for (const x of old) {
      const at = +(/^\{"t":(\d+)/.exec(sessionStorage.getItem(x)) || [])[1] || 0;
      if (live(at)) kept.push([x, at]); else sessionStorage.removeItem(x);
    }
  } catch { /* no sessionStorage */ }
  return kept.sort((a, b) => a[1] - b[1]);
}
function cacheSet(k, v) {
  const kept = cacheSweep();
  MEM.set(k, v);
  setTimeout(cacheSweep, CACHE_MIN * 60000 + 1000);   // (once this one has expired)
  try {
    const text = JSON.stringify(v), shown = new Set((S.legs || []).map(L => cacheKey(L.p))), spare = kept.filter(([x]) => x !== k && !shown.has(x));
    for (;;) {
      try { sessionStorage.setItem(k, text); return; } catch {
        if (!spare.length || text.length > 5242880) return;   // nothing left to clear, or too big even alone: memory still has it
        sessionStorage.removeItem(spare.shift()[0]);
      }
    }
  } catch { /* no sessionStorage; memory still has it */ }
}

/* ---------- airports ---------- */
function resolve(text) {
  const bare = s => s.replace(/（.*?）/g, '');
  const named = tok => PLACES.find(p => p.zh === tok || bare(p.zh) === tok || p.en.toUpperCase() === tok);
  // places are split by commas, 、 or /; a name of several words (NEW YORK) counts whole before its words do
  const tokens = text.toUpperCase().split(/[,，、/]+/).map(s => s.trim().replace(/\s+/g, ' ')).filter(Boolean)
    .flatMap(s => (s.includes(' ') && named(s) ? [s] : s.split(' ')));
  const codes = [];
  for (const tok of tokens) {
    if (/^[A-Z]{3}$/.test(tok)) { codes.push(tok); continue; }
    const hit = named(tok);
    if (hit) { codes.push(...hit.codes); continue; }
    return { codes: [], err: t('看不懂「{0}」，請輸入三碼機場代號，例如 TPE。', tok) };
  }
  // the box keeps every airport picked, so past 10 the search is refused rather than cut short without a word

  return { codes: all };
}

    aircraft: new Set(p.aircraft || []), maxTax: p.maxTax || 0, maxTaxCur: p.maxTaxCur || 'USD',
    // conditions on the flight itself, checked against the trips include_trips brings along. Those trips have
    // no segments (checked on real data 2026-10-14), so layover length can't be filtered without one call per row.

// true when a condition needs flight details, so a row without trips can't be checked and is left out
const tripRules = f => !!(f.dep.size || f.arr.size || f.maxStops < 9 || f.maxHours || f.noVia.size || f.aircraft.size);

  FEATURES.filter(x => { try { return !!(x.active && x.active()); } catch { return false; } }).length; };   // a module's own filter that is on (只看我付得起的)
const BANDS = [['凌晨', 0, 6], ['上午', 6, 12], ['下午', 12, 18], ['晚上', 18, 24]];
const bandOf = ts => { const h = parseInt(String(ts || '').slice(11, 13), 10); return Number.isFinite(h) ? BANDS.findIndex(([, a, b]) => h >= a && h < b) : -1; };

// Does one flight meet the 航班條件? Unknown values fail, so a filter never lets through what it can't check.
// a trip's aircraft families, one per flight: "Boeing 777-300ER" -> 777, "Bombardier CRJ900" -> CRJ900
const acFamily = x => { const m = /\b(A3\d\d|A220|7\d7|E\d{3}|CRJ ?\d{3}|Q400|ATR ?\d\d)/i.exec(String(x || '')); return m ? m[1].toUpperCase().replace(' ', '') : ''; };

  const segs = segsOf(t);

  if (f.dep.size && !f.dep.has(bandOf(t.DepartsAt || (segs[0] || {}).DepartsAt))) return false;
  if (f.arr.size && !f.arr.has(bandOf(t.ArrivesAt || (segs[segs.length - 1] || {}).ArrivesAt))) return false;
  if (stopsOf(t) > f.maxStops) return false;
  if (f.maxHours && !(num(t.TotalDuration) > 0 && num(t.TotalDuration) <= f.maxHours * 60)) return false;
  if (f.noVia.size && viaOf(t).some(a => f.noVia.has(a))) return false;

  if (f.aircraft.size && !planesOf(t).some(a => f.aircraft.has(a) || (f.aircraft.has('wide') && WIDE.has(a)))) return false;

const legsOf = p => [{ o: p.o, d: p.d, s: p.s, e: p.e, mixed: p.mixed, dyn: p.dyn }]

const cacheKey = lp => 'award-c:' + [lp.o, lp.d, lp.s, lp.e].join('|') + (lp.mixed ? '|m' : '') + (lp.dyn ? '|f' : '');

const INFLIGHT = new Map();

async function fetchPages(lp) {

    if (lp.mixed) q.set('min_cabin_pct', '50');      // default 100 hides mixed-cabin itineraries

    let res;

  S.params = S.legs[0].p; S.day = null; S.shown = 60; S.demo = !!demo; S.rows = null; S.truncated = false; S.cut = '';

      } catch (err) {

        L.error = err.message;   // the outbound is still worth showing
      }
      if (S.search !== p) return;
      if (i === 0) { useLeg(0); done(); } else renderLegs();

function offersOf(rows, cab, f) {

  for (const r of rows) {
    if (!r[cab + 'Available']) continue;
    const src = r.Source || (r.Route && r.Route.Source);
    if (f.off.has(src)) continue;
    const direct = !!r[cab + 'Direct'];
    if (f.direct && !direct) continue;
    const dmiles = num(r[cab + 'DirectMileageCost']);
    const useD = f.direct && dmiles > 0;
    const miles = useD ? dmiles : num(r[cab + 'MileageCost']);
    if (!miles) continue;
    const pickD = k => (useD && r[cab + 'Direct' + k] != null ? r[cab + 'Direct' + k] : r[cab + k]);
    const airlines = String(pickD('Airlines') || '').split(/[\s,]+/).filter(Boolean);
    if (f.carriers.size && !airlines.some(a => f.carriers.has(a))) continue;
    if (f.maxMiles && miles > f.maxMiles) continue;
    if (f.maxTax) { const tx = num(pickD('TotalTaxes')), v = tx ? inCur(tx, r.TaxesCurrency, f.maxTaxCur) : 0; if (v != null && v > f.maxTax) continue; }
    if (f.myBanks.size && !Object.keys(routesTo(src)).some(b => f.myBanks.has(b))) continue;   // 我的點數 can't reach it
    if (f.wd.size && !f.wd.has(parseDate(r.Date).getDay())) continue;
    const seats = num(pickD('RemainingSeats'));
    if (f.pax > 1 && seats && seats < f.pax) continue;   // 0 means the program doesn't say, so keep it
    if (FEATURES.length && FEATURES.some(x => x.filter && x.filter({ r, src, miles, direct, cab, seats, taxes: num(pickD('TotalTaxes')), cur: r.TaxesCurrency || '', date: r.Date }) === false)) continue;
    const bt = bestTrip(r.AvailabilityTrips, CABIN_BY[cab].api, f, miles);
    if (bt.drop) { if (bt.noData) out.noData++; continue; }
    out.push({
      id: r.ID, src, date: r.Date, from: r.Route ? r.Route.OriginAirport : '', to: r.Route ? r.Route.DestinationAirport : '',
      miles, dmiles, direct, taxes: num(pickD('TotalTaxes')), cur: r.TaxesCurrency || '', seats, base: num(r[cab + 'MileageCost']),

  list.sort((a, b) => (num(a.MileageCost) !== miles) - (num(b.MileageCost) !== miles) || num(a.MileageCost) - num(b.MileageCost) || (a.TotalDuration || 0) - (b.TotalDuration || 0));

async function toggleTrips(art) {

  try {

    // waits for the same /trips call instead of paying for a second one; a call that fails is dropped, so a reopen retries
    let p = S.trips.get(id);
    if (!p) {
      p = (S.demo ? Promise.resolve(demoTrips(id, src)) : api('/trips/' + encodeURIComponent(id)))
        .catch(err => { if (S.trips.get(id) === p) S.trips.delete(id); throw err; });

    const res = await p;
    box.innerHTML = verifyHtml(art.dataset) + tripsHtml(res, src) + transferHtml(src, +art.dataset.miles) + cashHtml(art.dataset);
    box.dataset.loaded = '1';

// gets through), GET /me again: one at a time, dropped after a sign-out or another sign-in meanwhile, and silent when
// it fails (a stale session already ends in call(); anything else waits for the next try).
let ME_CHECK = null;
function recheckMe() {
  const sent = getToken();
  if (ME || ME_CHECK || !sent || $('#app').hidden) return;
  ME_CHECK = call('GET', '/me')
    .then(m => { if (getToken() === sent && !$('#app').hidden) meKnown(m); }, () => {})
    .finally(() => { ME_CHECK = null; });
}
addEventListener('online', recheckMe);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') recheckMe(); });
// ME from an answer of GET /me. Known only now: the meter turns to the account's own count, and a page only the owner
// may open is drawn again. (The modules' onAuth is not run a second time: digest's would start its card over while
// it may be on screen.)
function meKnown(m) {
  const was = ME;
  ME = { email: m.email, role: m.role };
  if (was) return;
  showQuota(); loadQuota();
  if (/^#\/(admin|year)/.test(location.hash)) route();
}
function init() {
  langNames(); translateStatic();   // a saved English choice applies before anything is drawn
  renderMonths();
  renderProgramList();
  renderAlliances();
  renderCabins(null);
  renderRecent();
  $('#direct').checked = S.prefs.direct;
  $('#carriers').value = S.prefs.carriers;
  $('#maxmi').value = S.prefs.maxMiles || '';
  $('#maxtax').value = S.prefs.maxTax || '';
  $('#opt-mixed').checked = !!S.prefs.mixed;
  $('#opt-dyn').checked = !!S.prefs.dyn;
  cacheSweep(); setTimeout(cacheSweep, CACHE_MIN * 60000 + 1000);   // what this tab kept before a reload: expired now, the rest once expired
  const today = isoDate(new Date());
  const last = load('award-last', null);
  if (last && last.e >= today) {
    // a start that has passed shows as today on every leg (readForm moves it up anyway), except on a return or later
    // leg whose dates are all over: those stay, so the error says they have passed, not that 最晚 is before 最早
    const up = L => Object.assign({}, L, { s: L.s < today && L.e >= today ? today : L.s });
    fillForm(Object.assign({}, last, { s: last.s < today ? today : last.s, rt: last.rt && up(last.rt), mc: last.mc && last.mc.map(up) }));
    const p = readForm();
    if (p) {
      // show the last results again if they are still in the 15-minute cache (no API call), only with every leg there:
      // a leg that failed or wasn't kept would sit on 讀取中… with nothing loading it (搜尋 then fetches only that one)
      S.search = p; S.legs = legsOf(p).map(lp => ({ p: lp, rows: null, truncated: false, fetchedAt: 0, error: '' })); S.leg = 0;
      S.params = S.legs[0].p;
      const hits = S.legs.map(L => cacheGet(cacheKey(L.p)));
      if (hits.every(Boolean)) {
        S.legs.forEach((L, i) => Object.assign(L, { rows: hits[i].rows, truncated: hits[i].truncated, fetchedAt: hits[i].t }));
        $('#results').hidden = false; useLeg(0);
      }
    }
  } else {
    $('#from').value = 'TPE'; $('#to').value = 'SEA';
    const d = new Date();
    setRange(...monthRange(d.getMonth() === 11 ? d.getFullYear() + 1 : d.getFullYear(), (d.getMonth() + 1) % 12 + 1));
    S.search = S.params = readForm();
  }
  showNames($('#from')); showNames($('#to'));
  localStorage.removeItem('award-token');   // the old single-password token no longer works
  const reset = /^#reset=([A-Za-z0-9_-]{40,64})$/.exec(location.hash), join = JOIN.exec(location.hash);
  if (reset) startReset(reset[1]);
  else if (join && !getToken()) startJoin(join[1]);
  else if (getToken()) {
    if (join) { clearHash(); toast(t('你已經登入了，這個邀請碼可以留給別人用')); }
    resumeSession();
  } else showLogin('');
}
// The newer features, each in features/<name>.js, loaded in this order before init(). A test can load just some
// with ?only=a,b (also files not listed yet), or none with ?only=. FEATURE_V changes on every release, so phones
// fetch the new files.
const FEATURE_FILES = ['release', 'wallet', 'bonuses', 'notes', 'explore', 'year', 'hotels', 'push', 'digest', 'usage'];
const FEATURE_V = '955fe636d5';
function loadFeatures() {
  const only = new URLSearchParams(location.search).get('only');
  const files = only == null ? FEATURE_FILES : only.split(',').filter(x => /^[a-z0-9-]{1,30}$/.test(x));   // a test may load one not listed yet
  return Promise.all(files.map(f => new Promise(done => {
    const sc = document.createElement('script');
    sc.src = 'features/' + f + '.js?v=' + FEATURE_V;
    sc.async = false;   // keep the list order
    sc.onload = sc.onerror = () => done();
    document.body.appendChild(sc);
  })));
}
loadFeatures().then(init);
</script>
