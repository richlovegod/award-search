<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<title>里程機位搜尋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%231a73e8'/%3E%3Cpath fill='%23fff' transform='translate(4.4 4.4) scale(.63)' d='M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z'/%3E%3C/svg%3E">
<style>
:root{--blue:#1a73e8;--blue-d:#1967d2;--blue-l:#e8f0fe;--ink:#202124;--ink2:#5f6368;--line:#dadce0;--soft:#f1f3f4;--green:#137333;--green-l:#ceead6;--star:#3c4043;--oneworld:#7b1fa2;--skyteam:#1565c0;--none:#80868b;--hh:56px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:#fff}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--blue-d)}
svg{display:block}
.wrap{max-width:720px;margin:0 auto;padding:0 12px calc(28px + env(safe-area-inset-bottom))}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(#e8f0fe,#fff 60%)}
.lcard{width:100%;max-width:340px;text-align:center}
.lcard .logo{width:56px;height:56px;margin:0 auto 12px}
.lcard h1{font-size:22px;margin:0 0 4px}
.lcard p{margin:0 0 18px;color:var(--ink2)}
.lform{display:flex;gap:8px}
.lform input{flex:1;min-width:0;font-size:18px;letter-spacing:4px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.lform input:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.lform button{border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;padding:0 18px}
.lcard .err{color:#c5221f;min-height:22px;margin:10px 0 0;font-size:14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;min-width:0}
.brand .logo{width:28px;height:28px;flex:0 0 28px}
.quota{font-size:12px;color:var(--ink2);background:var(--soft);border-radius:999px;padding:3px 10px;white-space:nowrap}
.icon-btn{border:0;background:none;padding:7px;border-radius:50%;color:var(--ink2)}
.icon-btn:active{background:var(--soft)}

/* search card */
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);padding:14px 14px 34px;margin:14px 0 34px;position:relative}
.route{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:start}
.field{position:relative;border:1px solid var(--line);border-radius:8px;padding:5px 10px 6px;min-width:0;background:#fff}
.field:focus-within{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.field label{display:block;font-size:12px;color:var(--ink2);line-height:1.3}
.field input{display:block;border:0;outline:0;width:100%;min-width:0;padding:1px 0;background:transparent;font-size:17px;-webkit-appearance:none;appearance:none;border-radius:0}
.ap input{text-transform:uppercase;font-weight:600;letter-spacing:.5px}
.ap input::placeholder{text-transform:none;font-weight:400;letter-spacing:0}
.names{font-size:12px;color:var(--ink2);height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swap{margin-top:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink2)}
.swap:active{background:var(--soft)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.16);z-index:15;max-height:300px;overflow:auto;-webkit-overflow-scrolling:touch}
.sugg button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:10px 12px;border-bottom:1px solid var(--soft)}
.sugg button:last-child{border-bottom:0}
.sugg button:active,.sugg button:hover{background:var(--blue-l)}
.sugg b{flex:0 0 auto;min-width:68px;font-size:14px;letter-spacing:.3px}
.sugg span{color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:8px}
input[type=date]{min-height:25px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.months{display:flex;gap:6px;overflow-x:auto;margin:8px -14px 0;padding:2px 14px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.months::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;padding:4px 12px;font-size:14px;white-space:nowrap}
.mchip small{color:var(--ink2);font-size:11px;margin-right:3px}
.mchip.on{background:var(--blue-l);border-color:#aecbfa;color:var(--blue-d);font-weight:600}
.lbl{font-size:12px;color:var(--ink2);margin:12px 0 5px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-left:1px solid var(--line);background:#fff;padding:7px 0 6px;line-height:1.25}
.seg button:first-child{border-left:0}
.seg button[aria-checked=true]{background:var(--blue-l);color:var(--blue-d);font-weight:600}
.seg .n{display:block;font-size:11px;color:var(--ink2);font-weight:400;min-height:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:6px 10px;font-size:14px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--blue-l);border-color:#aecbfa;color:var(--blue-d);font-weight:600}
.chip.part{border-style:dashed;border-color:#8ab4f8}
details.progs{margin-top:8px;border:1px solid var(--line);border-radius:8px}
details.progs summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;cursor:pointer}
details.progs summary::-webkit-details-marker{display:none}
details.progs summary::after{content:"";width:7px;height:7px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:-4px 2px 0 8px}
details.progs[open] summary::after{transform:rotate(-135deg);margin-top:4px}
details.progs summary span:last-of-type{margin-left:auto;color:var(--ink2);font-size:13px}
.pl{padding:0 10px 8px}
.pgh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin:8px 0 4px}
.pgh .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}
.pi{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0;min-width:0}
.pi input{width:18px;height:18px;margin:0;flex:0 0 18px;accent-color:var(--blue)}
.pi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pi em{font-style:normal;font-size:11px;color:var(--green);font-weight:600}
.opts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;margin-top:10px}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:38px;height:22px;border-radius:11px;background:#bdc1c6;position:relative;transition:background .2s;flex:0 0 38px}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+.tr{background:var(--blue)}
.switch input:checked+.tr::after{transform:translateX(16px)}
.switch input:focus-visible+.tr{outline:2px solid var(--blue);outline-offset:2px}
.ferr{color:#c5221f;font-size:14px;margin:8px 0 0;min-height:0}
.go{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--blue);color:#fff;font-weight:600;font-size:16px;padding:10px 26px 10px 20px;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);white-space:nowrap}
.go:active{background:var(--blue-d)}
.go[disabled]{opacity:.75}

/* recent */
.recent{display:flex;gap:6px;overflow-x:auto;margin:-6px -12px 6px;padding:0 12px 4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;padding:5px 12px;color:var(--ink2);white-space:nowrap}

/* results */
#results{scroll-margin-top:calc(var(--hh) + 6px)}
.banner{border-radius:12px;padding:10px 12px;margin:10px 0;background:#fef7e0;border:1px solid #feefc3;font-size:14px}
.banner.bad{background:#fce8e6;border-color:#fad2cf}
#banner.sticky{position:sticky;top:var(--hh);z-index:6;background:#fff;padding-top:2px}
.banner.demo{display:flex;align-items:center;gap:8px;margin:4px 0 6px;padding:7px 10px;background:#fff3c4;border-color:#f9d96b;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.banner.demo .acts{margin:0 0 0 auto;flex:0 0 auto}
.banner.demo .btn{padding:4px 12px}
.demo-on .dh{top:calc(var(--hh) + var(--bh,0px))}
.banner b{display:block;margin-bottom:2px}
.banner.demo b{display:inline;margin:0 6px 0 0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-size:14px;text-decoration:none;color:var(--blue-d);display:inline-block}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.sum{font-size:14px;color:var(--ink2);margin:6px 0 2px}
.sum b{color:var(--ink)}
.fresh{font-size:12px;color:var(--ink2);margin:0 0 10px}
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 18px;margin:8px 0 6px}
.mh{font-weight:600;font-size:14px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{font-size:11px;color:var(--ink2);text-align:center;padding-bottom:2px}
.day{border:0;border-radius:7px;min-height:46px;padding:4px 0 3px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;position:relative;line-height:1.15;min-width:0}
.day .dn{font-size:12px;color:var(--ink2)}
.day .dm{font-size:11.5px;font-weight:700;white-space:nowrap;letter-spacing:-.3px}
.day.none .dm{color:#bdc1c6;font-weight:400}
.day.ok{background:var(--soft)}
.day.good{background:var(--green-l);color:#0d652d}
.day.best{background:var(--green);color:#fff}
.day.best .dn{color:#e6f4ea}
.day.dir::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.day.sel{box-shadow:0 0 0 2px var(--blue)}
.day.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink2);margin:2px 0 12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;font-size:13px;color:var(--ink2)}
.sortbar .chip{padding:4px 10px;font-size:13px}
.dayf{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.dh{position:sticky;top:var(--hh);z-index:4;background:rgba(255,255,255,.96);margin:0;padding:10px 2px 4px;font-size:15px}
.offer{border:1px solid var(--line);border-radius:12px;margin:6px 0;background:#fff;overflow:hidden}
.ohead{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px 9px}
.ohead:active{background:#f8f9fa}
.o1,.o2,.o3{display:flex;align-items:baseline;gap:6px;min-width:0}
.o1 .pn{font-weight:600;white-space:nowrap}
.o1 .pz{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.al{flex:0 0 auto;font-size:11px;color:#fff;background:var(--c);border-radius:4px;padding:1px 5px;line-height:1.4;align-self:center}
.mi{margin-left:auto;font-size:18px;font-weight:700;white-space:nowrap;color:var(--ink)}
.mi small{font-size:12px;font-weight:400;color:var(--ink2)}
.o2{font-size:13px;color:var(--ink2);margin-top:2px;flex-wrap:wrap}
.o2 .od{color:var(--ink);font-weight:600}
.tag{border-radius:4px;padding:0 5px;background:var(--soft);font-size:12px}
.tag.d{background:var(--green-l);color:#0d652d}
.tx{margin-left:auto;white-space:nowrap}
.o3{font-size:12px;color:var(--ink2);margin-top:3px}
.o3 .ca{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.o3 .age{white-space:nowrap}
.o3 .chev{width:16px;height:16px;flex:0 0 16px;transition:transform .2s;align-self:center}
.ohead[aria-expanded=true] .chev{transform:rotate(180deg)}
.trips{border-top:1px solid var(--line);background:#f8f9fa;padding:4px 12px 12px;font-size:13px}
.trip{padding:8px 0;border-bottom:1px dashed var(--line)}
.t1{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;font-size:14px}
.t1 b{font-size:16px}
.t1 sup{color:#c5221f;font-size:11px}
.t1 .t-mi{margin-left:auto;font-weight:600;white-space:nowrap}
.t2{color:var(--ink2);margin-top:2px}
.segs{margin:6px 0 0 2px;border-left:2px solid var(--line);padding-left:10px}
.sg{margin:4px 0}
.sg1 b{margin-right:6px}
.sg2{font-size:12px;color:var(--ink2)}
.lay{font-size:12px;color:#b06000;margin:5px 0}
.book{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tload,.tnone,.terr,.tmore{padding:10px 0;color:var(--ink2)}
.terr{color:#c5221f}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--ink2);margin:8px 0}
.empty .chips{justify-content:center;margin-top:10px}
.more-btn{display:block;margin:12px auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;color:var(--blue-d)}
.skel{height:76px;border-radius:12px;margin:6px 0;background:linear-gradient(90deg,#f1f3f4 25%,#e8eaed 37%,#f1f3f4 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.note{font-size:12px;color:var(--ink2);margin:16px 0 0}
footer{text-align:center;font-size:12px;color:var(--ink2);margin-top:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<section id="login" class="login" hidden>
  <div class="lcard">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1a73e8"/><path fill="#fff" transform="translate(4.4 4.4) scale(.63)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
    <h1>里程機位搜尋</h1>
    <p>請輸入密碼</p>
    <form id="lf" class="lform">
      <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" aria-label="密碼">
      <button id="lgo" type="submit">進入</button>
    </form>
    <p id="lerr" class="err" role="alert"></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><div class="in">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#1a73e8"/><path fill="#fff" transform="translate(4.4 4.4) scale(.63)" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>
      <span>里程機位搜尋</span>
    </div>
    <span id="quota" class="quota" hidden></span>
    <button id="lock" class="icon-btn" type="button" aria-label="登出" title="登出"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg></button>
  </div></header>

  <main class="wrap">
    <form id="sf" class="card" autocomplete="off" novalidate>
      <div class="route" id="route">
        <div class="field ap">
          <label for="from">出發</label>
          <input id="from" placeholder="例：TPE" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <div class="names" id="from-names"></div>
        </div>
        <button type="button" class="swap" id="swap" aria-label="交換出發和抵達"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg></button>
        <div class="field ap">
          <label for="to">抵達</label>
          <input id="to" placeholder="例：SEA" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
          <div class="names" id="to-names"></div>
        </div>
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div class="dates">
        <div class="field"><label for="d1">最早出發</label><input type="date" id="d1"></div>
        <div class="field"><label for="d2">最晚出發</label><input type="date" id="d2"></div>
      </div>
      <div class="months" id="months"></div>

      <div class="lbl">艙等</div>
      <div class="seg" id="cabins" role="radiogroup" aria-label="艙等"></div>

      <div class="lbl">用哪個聯盟的里程</div>
      <div class="chips" id="alliances"></div>
      <details class="progs" id="progs">
        <summary><span>挑選里程計畫</span><span id="prog-sum"></span></summary>
        <div class="pl" id="prog-list"></div>
      </details>

      <div class="opts">
        <label class="switch"><input type="checkbox" id="direct"><span class="tr"></span><span>只看直飛</span></label>
        <div class="field"><label for="carriers">實際搭乘（航空公司代碼）</label><input id="carriers" placeholder="不限，例：BR,DL" autocapitalize="characters" autocorrect="off" spellcheck="false"></div>
      </div>
      <p class="ferr" id="ferr" role="alert"></p>
      <button class="go" id="go" type="submit"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span id="go-t">搜尋</span></button>
    </form>

    <div class="recent" id="recent"></div>

    <section id="results" hidden>
      <div id="banner"></div>
      <div class="sum" id="sum" aria-live="polite"></div>
      <div class="fresh" id="fresh"></div>

}

}
function ago(ts) {
  const t = Date.parse(ts);
  if (!t) return '';
  const m = Math.max(0, (Date.now() - t) / 60000);
  if (m < 60) return Math.max(1, Math.round(m)) + ' 分鐘前更新';
  if (m < 2880) return Math.round(m / 60) + ' 小時前更新';
  return Math.round(m / 1440) + ' 天前更新';
}
function dur(min) {
  min = Math.round(min || 0);
  if (min <= 0) return '';
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + ' 小時' : '') + (h && m ? ' ' : '') + (m ? m + ' 分' : '');
}

/* ---------- API ---------- */
class ApiError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }
async function api(path) {
  let r;
  try {
    r = await fetch(RELAY + path, { headers: { Authorization: 'Bearer ' + (localStorage.getItem('award-token') || '') } });
  } catch {
    throw new ApiError('network', '連不上中繼站，請檢查網路後再試一次。');
  }
  const q = r.headers.get('X-RateLimit-Remaining');
  if (q !== null && q !== '' && !isNaN(q)) setQuota(Number(q));
  const text = await r.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (r.ok) {
    if (!body) throw new ApiError('bad', 'seats.aero 回傳的資料看不懂，等一下再試。');
    return body;
  }
  if (body && body.error === 'auth') { logout('請重新輸入密碼。'); throw new ApiError('auth', '請重新輸入密碼。'); }
  if (body && body.error === 'param') throw new ApiError('param', '搜尋條件的格式不對。');
  const t = text.toLowerCase();
  if (t.includes('subscription_expired')) throw new ApiError('expired', 'seats.aero 的 Pro 訂閱已經過期，續訂之後才查得到。');
  if (r.status === 429) throw new ApiError('quota', '今天的 1,000 次查詢額度用完了，' + resetText() + '重置。');
  if (t.includes('partner_key') || r.status === 401 || r.status === 403) throw new ApiError('key', 'seats.aero 不接受這把 API key（' + text.slice(0, 40) + '），需要重新產生一把。');
  throw new ApiError('upstream', 'seats.aero 暫時有問題（HTTP ' + r.status + '），等一下再試。');
}
function setQuota(n) {
  save('award-quota', { n, day: new Date().toISOString().slice(0, 10) });
  showQuota(n);
}
function showQuota(n) {
  const el = $('#quota');
  el.textContent = '今日剩 ' + n.toLocaleString('en-US') + ' 次';
  el.title = '每天' + resetText().replace('會在你這邊的 ', '') + '重置';
  el.hidden = false;
}

/* ---------- cache ---------- */
const MEM = new Map();
function cacheGet(k) {
  let v = MEM.get(k);
  if (!v) { try { v = JSON.parse(sessionStorage.getItem(k)); } catch {} }
  if (v && Date.now() - v.t < CACHE_MIN * 60000) { MEM.set(k, v); return v; }
  return null;
}
function cacheSet(k, v) {
  MEM.set(k, v);
  try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* too big for sessionStorage; memory still has it */ }
}

/* ---------- airports ---------- */
function resolve(text) {
  const tokens = text.toUpperCase().split(/[\s,，、/]+/).filter(Boolean);
  const codes = [];
  for (const t of tokens) {
    if (/^[A-Z]{3}$/.test(t)) { codes.push(t); continue; }
    const bare = s => s.replace(/（.*?）/g, '');
    const hit = PLACES.find(p => p.zh === t || bare(p.zh) === t || p.en.toUpperCase() === t);
    if (hit) { codes.push(...hit.codes); continue; }
    return { codes: [], err: '看不懂「' + t + '」，請輸入三碼機場代號，例如 TPE。' };
  }
  return { codes: [...new Set(codes)].slice(0, 10) };
}
function showNames(input) {
  const r = resolve(input.value);
  $('#' + input.id + '-names').textContent = r.err ? '' : r.codes.map(c => AIRPORT_ZH[c] || c).join('、');
}
let suggFor = null;
function suggest(input) {
  suggFor = input;
  const parts = input.value.split(/[,，、]/);
  const q = parts[parts.length - 1].trim().toLowerCase();
  let items = q
    ? PLACES.filter(p => p.codes.some(c => c.toLowerCase().startsWith(q)) || p.zh.includes(q) || p.en.toLowerCase().includes(q))
    : PLACES.filter(p => p.pop);
  items = items.slice(0, q ? 8 : 12);
  const box = $('#sugg');
  if (!items.length) { box.hidden = true; return; }
  box.innerHTML = items.map(p => '<button type="button" data-codes="' + p.codes.join(',') + '"><b>' + p.codes.join(',') + '</b><span>' + esc(p.zh) + '　' + esc(p.en) + '</span></button>').join('');
  box.hidden = false;
}
function pick(codes) {
  const input = suggFor;
  if (!input) return;
  const parts = input.value.split(/[,，、]/);
  parts[parts.length - 1] = codes;
  input.value = parts.map(s => s.trim()).filter(Boolean).join(',');
  showNames(input);
  $('#sugg').hidden = true;
  if (input.id === 'from' && !$('#to').value) $('#to').focus();
  else input.blur();
}
for (const id of ['from', 'to']) {
  const input = $('#' + id);
  input.addEventListener('focus', () => suggest(input));

/* ---------- search ---------- */
function formErr(msg) { $('#ferr').textContent = msg || ''; }
function readForm() {
  const o = resolve($('#from').value), d = resolve($('#to').value);
  if (o.err || d.err) return formErr(o.err || d.err);
  if (!o.codes.length || !d.codes.length) return formErr('請輸入出發和抵達的機場。');
  let s = $('#d1').value, e = $('#d2').value;
  if (!s || !e) return formErr('請選出發日期的範圍。');
  if (e < s) [s, e] = [e, s];
  const today = isoDate(new Date());
  if (e < today) return formErr('這些日期已經過了。');
  if (s < today) s = today;
  if (daysBetween(s, e) > MAX_DAYS) return formErr('日期範圍最多 3 個月，請縮短一點。');
  formErr('');
  return { o: o.codes.join(','), d: d.codes.join(','), s, e };
}
function setBusy(on) {
  $('#go').disabled = on;
  $('#go-t').textContent = on ? '搜尋中…' : '搜尋';
}
const cacheKey = p => 'award-c:' + [p.o, p.d, p.s, p.e].join('|');
const toResults = () => $('#results').scrollIntoView({ behavior: 'smooth', block: 'start' });
async function runSearch(p, demo, scroll) {
  const done = () => { if (scroll && S.params === p) toResults(); };
  S.params = p; S.day = null; S.shown = 60; S.demo = !!demo; S.rows = null; S.truncated = false;
  save('award-last', p);
  addRecent(p);
  $('#results').hidden = false;
  setBanner('');
  $('#sum').textContent = '搜尋中…';
  $('#fresh').textContent = '';
  $('#cal').innerHTML = '';
  $('#legend').hidden = true;
  $('#sortbar').innerHTML = '';
  $('#list').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  if (demo) {
    S.rows = demoRows(p);
    S.fetchedAt = Date.now();
    render();
    return done();
  }
  const hit = cacheGet(cacheKey(p));
  if (hit) {
    S.rows = hit.rows; S.truncated = hit.truncated; S.fetchedAt = hit.t;
    render();
    return done();
  }
  setBusy(true);
  try {
    const rows = [];
    let cursor = null, more = false, pages = 0;
    do {
      const q = new URLSearchParams({ origin_airport: p.o, destination_airport: p.d, start_date: p.s, end_date: p.e, take: '1000' });
      if (cursor != null) { q.set('cursor', cursor); q.set('skip', rows.length); }
      const res = await api('/search?' + q);
      rows.push(...(res.data || []));
      more = !!res.hasMore && res.cursor != null;
      cursor = res.cursor;
      pages++;
    } while (more && pages < MAX_PAGES);
    if (S.params !== p) return;
    S.rows = rows; S.truncated = more; S.fetchedAt = Date.now();
    cacheSet(cacheKey(p), { t: S.fetchedAt, rows, truncated: more });
    render();
    done();
  } catch (err) {
    if (S.params === p) { showError(err); done(); }
  } finally {
    setBusy(false);
  }
}

/* ---------- results ---------- */
function offersOf(rows, cab, f) {
  const out = [];
  for (const r of rows) {
    if (!r[cab + 'Available']) continue;
    const src = r.Source || (r.Route && r.Route.Source);
    if (f.off.has(src)) continue;
    const direct = !!r[cab + 'Direct'];
    if (f.direct && !direct) continue;
    const dmiles = num(r[cab + 'DirectMileageCost']);
    const useD = f.direct && dmiles > 0;
    const miles = useD ? dmiles : num(r[cab + 'MileageCost']);
    if (!miles) continue;
    const pickD = k => (useD && r[cab + 'Direct' + k] != null ? r[cab + 'Direct' + k] : r[cab + k]);
    const airlines = String(pickD('Airlines') || '').split(/[\s,]+/).filter(Boolean);
    if (f.carriers.size && !airlines.some(a => f.carriers.has(a))) continue;
    out.push({
      id: r.ID, src, date: r.Date, from: r.Route ? r.Route.OriginAirport : '', to: r.Route ? r.Route.DestinationAirport : '',
      miles, dmiles, direct, taxes: num(pickD('TotalTaxes')), cur: r.TaxesCurrency || '', seats: num(pickD('RemainingSeats')),
      airlines, updated: r.UpdatedAt,
    });
  }
  return out;
}
function render() {
  renderCabins(null);
  if (!S.rows || !S.params) return;
  const f = filt(), cab = S.prefs.cabin;
  const counts = {};
  for (const c of CABINS) counts[c.k] = offersOf(S.rows, c.k, f).length;
  renderCabins(counts);
  const offers = offersOf(S.rows, cab, f);
  const all = offersOf(S.rows, cab, Object.assign({}, f, { off: new Set() }));
  const per = {};
  for (const o of all) per[o.src] = (per[o.src] || 0) + 1;
  for (const em of $$('#prog-list em')) em.textContent = per[em.dataset.c] ? per[em.dataset.c] : '';
  if (S.demo) setBanner('<span><b>示範資料</b>數字都是假的</span><div class="acts"><button type="button" class="btn" data-act="exit-demo">結束示範</button></div>', 'demo');
  renderSummary(offers, counts);
  renderCalendar(offers);
  renderSortbar();
  renderList(offers, counts);
}
function renderSummary(offers) {
  const p = S.params, cab = CABIN_BY[S.prefs.cabin].name;
  const days = new Set(offers.map(o => o.date)).size;
  $('#sum').innerHTML = '<b>' + esc(p.o) + ' → ' + esc(p.d) + '</b>　' + md(p.s) + ' 到 ' + md(p.e) + '<br>' + cab + '：<b>' + offers.length + '</b> 筆，' + days + ' 天有位';
  const ts = offers.map(o => Date.parse(o.updated)).filter(Boolean);
  let fresh = '';
  if (ts.length) {
    const newest = new Date(Math.max(...ts)).toISOString(), oldest = new Date(Math.min(...ts)).toISOString();
    fresh = '資料更新：最新 ' + ago(newest).replace('更新', '') + '，最舊 ' + ago(oldest).replace('更新', '');
  }
  if (S.truncated) fresh += (fresh ? '。' : '') + '結果太多，只拿到前 5,000 筆，請縮短日期。';
  $('#fresh').textContent = fresh;
}
function renderCalendar(offers) {
  const p = S.params;
  const best = new Map(), dir = new Set();
  for (const o of offers) {
    if (!best.has(o.date) || o.miles < best.get(o.date)) best.set(o.date, o.miles);
    if (o.direct) dir.add(o.date);
  }
  const vals = [...best.values()].sort((a, b) => a - b);
  const min = vals[0] || 0, third = vals[Math.floor((vals.length - 1) / 3)] || 0;
  const level = m => (m <= min * 1.05 ? 'best' : m <= third ? 'good' : 'ok');
  const start = parseDate(p.s), end = parseDate(p.e);
  let h = '';
  for (let y = start.getFullYear(), m = start.getMonth(); y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth()); m === 11 ? (y++, m = 0) : m++) {
    h += '<div class="month"><div class="mh">' + y + ' 年 ' + (m + 1) + ' 月</div><div class="grid">' + [...WD].map(w => '<div class="wd">' + w + '</div>').join('');
    const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) h += '<span class="day out"></span>';
    for (let d = 1; d <= last; d++) {
      const iso = y + '-' + pad(m + 1) + '-' + pad(d);
      if (iso < p.s || iso > p.e) { h += '<span class="day out">' + d + '</span>'; continue; }
      const b = best.get(iso);
      const cls = (b ? level(b) : 'none') + (dir.has(iso) ? ' dir' : '') + (S.day === iso ? ' sel' : '');
      h += '<button type="button" class="day ' + cls + '" data-d="' + iso + '" aria-label="' + md(iso) + (b ? ' 最低 ' + fmtMiles(b) + ' 哩' : ' 沒有位子') + '"><span class="dn">' + d + '</span><span class="dm">' + (b ? fmtMan(b) : '·') + '</span></button>';
    }
    h += '</div></div>';
  }
  $('#cal').innerHTML = h;
  $('#legend').hidden = !offers.length;
}

function renderList(offers, counts) {

  else if (sort === 'seats') list.sort((a, b) => (b.seats || 0) - (a.seats || 0) || a.miles - b.miles);
  else list.sort((a, b) => a.date.localeCompare(b.date) || a.miles - b.miles);
  if (!list.length) {

  for (const o of shown) {

/* ---------- trip details ---------- */
async function toggleTrips(art) {
  const box = art.querySelector('.trips'), head = art.querySelector('.ohead');
  const open = box.hidden;
  box.hidden = !open;
  head.setAttribute('aria-expanded', String(open));
  if (!open || box.dataset.loaded) return;
  const id = art.dataset.id, src = art.dataset.src;
  box.innerHTML = '<div class="tload">讀取航班中…</div>';
  try {
    let res = S.trips.get(id);
    if (!res) {
      res = S.demo ? demoTrips(id, src) : await api('/trips/' + encodeURIComponent(id));
      S.trips.set(id, res);
    }
    box.innerHTML = tripsHtml(res, src);
    box.dataset.loaded = '1';
  } catch (err) {
    box.innerHTML = '<div class="terr">' + esc(err.message) + '</div>';
  }
}
function tripsHtml(res, src) {
  const want = CABIN_BY[S.prefs.cabin].api;
  let trips = (res.data || []).slice();
  const mine = trips.filter(t => String(t.Cabin || '').toLowerCase() === want);
  if (mine.length) trips = mine;
  if (S.prefs.direct) {
    const nonstop = trips.filter(t => (t.AvailabilitySegments || []).length === 1 || t.Stops === 0);
    if (nonstop.length) trips = nonstop;
  }
  trips.sort((a, b) => num(a.MileageCost) - num(b.MileageCost) || (a.TotalDuration || 0) - (b.TotalDuration || 0));
  let h = trips.length ? trips.slice(0, 12).map(tripHtml).join('') : '<div class="tnone">seats.aero 沒有這筆的航班細節。</div>';
  if (trips.length > 12) h += '<div class="tmore">還有 ' + (trips.length - 12) + ' 個航班組合沒有列出。</div>';
  const links = (res.booking_links || []).filter(l => /^https:\/\//i.test(l.link || '')).sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
  const p = prog(src);
  h += '<div class="book">' + (links.length
    ? links.map(l => '<a class="btn' + (l.primary ? ' pri' : '') + '" href="' + esc(l.link) + '" target="_blank" rel="noopener">' + esc(l.label || '去訂位') + '</a>').join('')
    : (p.url ? '<a class="btn pri" href="' + esc(p.url) + '" target="_blank" rel="noopener">到 ' + esc(p.name) + ' 官網訂位</a>' : '')) + '</div>';
  return h;
}
function tripHtml(t) {
  const segs = (t.AvailabilitySegments || []).slice().sort((a, b) => (a.Order || 0) - (b.Order || 0));
  const first = segs[0] || {}, last = segs[segs.length - 1] || {};
  const dep = t.DepartsAt || first.DepartsAt, arr = t.ArrivesAt || last.ArrivesAt;
  const plus = dayDiff(dep, arr);
  const stops = segs.length ? segs.length - 1 : num(t.Stops);
  const miles = num(t.MileageCost);
  let h = '<div class="trip"><div class="t1"><b>' + hm(dep) + '</b> ' + esc(first.OriginAirport || '') + ' → <b>' + hm(arr) + '</b> ' + esc(last.DestinationAirport || '') +
    (plus ? '<sup>+' + plus + '</sup>' : '') + '<span class="t-mi">' + (miles ? fmtMiles(miles) + ' 哩' : '') + (t.TotalTaxes ? ' + ' + money(t.TotalTaxes / 100, t.TaxesCurrency) : '') + '</span></div>';
  const bits = [esc(t.FlightNumbers || ''), dur(t.TotalDuration), stops ? '轉機 ' + stops + ' 次' : '直飛'];
  if (num(t.RemainingSeats)) bits.push('剩 ' + num(t.RemainingSeats) + ' 位');
  if (t.MixedCabinPct) bits.push('有 ' + Math.round(t.MixedCabinPct) + '% 航程是較低艙等');
  h += '<div class="t2">' + bits.filter(Boolean).join(' · ') + '</div>';
  const extra = s => [s.AircraftName && esc(s.AircraftName), s.Cabin && CABIN_ZH[String(s.Cabin).toLowerCase()], s.FareClass && '艙位 ' + esc(s.FareClass)].filter(Boolean).join(' · ');
  if (segs.length === 1) {
    if (extra(segs[0])) h += '<div class="sg2">' + extra(segs[0]) + '</div>';
  } else if (segs.length > 1) {
    h += '<div class="segs">';
    segs.forEach((s, i) => {
      if (i) h += '<div class="lay">在 ' + esc(s.OriginAirport) + ' 轉機 ' + dur(minsBetween(segs[i - 1].ArrivesAt, s.DepartsAt)) + '</div>';
      const plusSeg = dayDiff(s.DepartsAt, s.ArrivesAt);
      h += '<div class="sg"><div class="sg1"><b>' + esc(s.FlightNumber || '') + '</b>' + esc(s.OriginAirport) + ' ' + hm(s.DepartsAt) + ' → ' + esc(s.DestinationAirport) + ' ' + hm(s.ArrivesAt) +
        (plusSeg ? '<sup>+' + plusSeg + '</sup>' : '') + '</div>' + (extra(s) ? '<div class="sg2">' + extra(s) + '</div>' : '') + '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

/* ---------- demo data (clearly fake; only used when the user asks for it) ---------- */
function rng(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
  return () => {
    h = (h + 0x6D2B79F5) | 0;
    let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const DEMO_CARRIERS = { star: ['BR', 'UA', 'NH'], oneworld: ['AS', 'CX', 'JL'], skyteam: ['DL', 'CI', 'KE'], none: ['EK', 'EY'] };
const DEMO_HUB = { star: 'NRT', oneworld: 'HKG', skyteam: 'ICN', none: 'DXB' };
function demoRows(p) {
  const rows = [];
  const o = p.o.split(',')[0], d = p.d.split(',')[0];
  const srcs = ['united', 'aeroplan', 'turkish', 'lufthansa', 'alaska', 'american', 'qantas', 'delta', 'flyingblue', 'virginatlantic', 'emirates', 'etihad'];
  for (let t = parseDate(p.s); isoDate(t) <= p.e; t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)) {
    const date = isoDate(t);
    for (const src of srcs) {
      const r = rng(date + src + o + d);
      if (r() < 0.4) continue;
      const al = PROGRAMS[src][2], cs = DEMO_CARRIERS[al];
      const row = { ID: 'demo' + date.replace(/-/g, '') + src, Route: { OriginAirport: o, DestinationAirport: d, Source: src }, Date: date, Source: src, TaxesCurrency: 'USD',
        UpdatedAt: new Date(Date.now() - r() * 50 * 36e5).toISOString() };
      for (const [k, lo, hi, pr] of [['Y', 25, 45, 0.85], ['W', 45, 75, 0.35], ['J', 60, 130, 0.5], ['F', 110, 190, 0.12]]) {
        const ok = r() < pr, direct = ok && r() < 0.5, cost = Math.round(lo + r() * (hi - lo)) * 1000;
        const taxes = Math.round(560 + r() * 25000), seats = 1 + Math.floor(r() * 6);
        Object.assign(row, {
          [k + 'Available']: ok, [k + 'MileageCost']: ok ? String(cost) : '0', [k + 'Direct']: direct,
          [k + 'DirectMileageCost']: direct ? cost : 0, [k + 'TotalTaxes']: ok ? taxes : 0, [k + 'DirectTotalTaxes']: direct ? taxes : 0,
          [k + 'RemainingSeats']: ok ? seats : 0, [k + 'DirectRemainingSeats']: direct ? seats : 0,
          [k + 'Airlines']: ok ? cs.slice(0, 1 + Math.floor(r() * 2)).join(', ') : '', [k + 'DirectAirlines']: direct ? cs[0] : '',
        });
      }
      rows.push(row);
    }
  }
  return rows;
}
function demoTrips(id, src) {
  const row = (S.rows || []).find(x => x.ID === id);
  if (!row) return { data: [] };
  const r = rng(id), al = PROGRAMS[src] ? PROGRAMS[src][2] : 'none', cs = DEMO_CARRIERS[al], hub = DEMO_HUB[al];
  const o = row.Route.OriginAirport, d = row.Route.DestinationAirport, data = [];
  for (const c of CABINS) {
    if (!row[c.k + 'Available']) continue;
    const at = (day, h, m) => row.Date.slice(0, 8) + pad(+row.Date.slice(8) + day) + 'T' + pad(h) + ':' + pad(m) + ':00Z';
    const fn = cs[0] + ' ' + (10 + Math.floor(r() * 90));
    if (row[c.k + 'Direct']) {
      data.push({ Cabin: c.api, MileageCost: num(row[c.k + 'MileageCost']), TotalTaxes: row[c.k + 'TotalTaxes'], TaxesCurrency: 'USD', RemainingSeats: row[c.k + 'RemainingSeats'],
        FlightNumbers: fn, TotalDuration: 650, Stops: 0,
        AvailabilitySegments: [{ FlightNumber: fn.replace(' ', ''), OriginAirport: o, DestinationAirport: d, DepartsAt: at(0, 23, 40), ArrivesAt: at(0, 19, 30), AircraftName: 'Boeing 777-300ER', Cabin: c.api, FareClass: 'I', Order: 0 }] });
    }
    const f1 = cs[0] + (100 + Math.floor(r() * 800)), f2 = cs[cs.length - 1] + (100 + Math.floor(r() * 800));
    data.push({ Cabin: c.api, MileageCost: num(row[c.k + 'MileageCost']), TotalTaxes: row[c.k + 'TotalTaxes'], TaxesCurrency: 'USD', RemainingSeats: 2,
      FlightNumbers: f1 + ', ' + f2, TotalDuration: 900, Stops: 1,
      AvailabilitySegments: [
        { FlightNumber: f1, OriginAirport: o, DestinationAirport: hub, DepartsAt: at(0, 8, 50), ArrivesAt: at(0, 13, 10), AircraftName: 'Airbus A350-900', Cabin: c.api, FareClass: 'I', Order: 0 },
        { FlightNumber: f2, OriginAirport: hub, DestinationAirport: d, DepartsAt: at(0, 16, 55), ArrivesAt: at(0, 9, 40), AircraftName: 'Boeing 787-9', Cabin: c.api, FareClass: 'I', Order: 1 }] });
  }
  return { data, booking_links: [] };
}
