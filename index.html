<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFFCF6">
<meta name="color-scheme" content="light">
<title>里程機位搜尋</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cg stroke='%233E3A39' stroke-width='3'%3E%3Crect x='6' y='9' width='28' height='24' rx='9' fill='%23F2A497'/%3E%3Ccircle cx='14.5' cy='19' r='4' fill='%23F6D27A'/%3E%3Ccircle cx='25.5' cy='19' r='4' fill='%23F6D27A'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* Picture-book style, shared with the Nordic trip site: Huninn, warm paper, 3px ink outlines,
   coral / yellow / water / green fills. Huninn has a single weight, so hierarchy comes from size and fill, not bold. */
:root{
  --paper:#FFFCF6; --ink:#3E3A39; --ink2:#6B6461;
  --coral:#F2A497; --yellow:#F6D27A; --water:#A8D3E6; --green:#B9DAA5;
  --coral-t:#FCE6E0; --yellow-t:#FCF1D3; --water-t:#E6F2F8; --green-t:#EBF4E5;
  --line:3px solid var(--ink); --r:22px;
  --star:var(--yellow); --oneworld:var(--coral); --skyteam:var(--water); --none:var(--green);
  --font:'Huninn','jf-openhuninn','PingFang TC','Microsoft JhengHei',sans-serif;
  --pop:cubic-bezier(.34,1.56,.64,1);
  --hh:64px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--paper)}
body{margin:0;font:16px/1.55 var(--font);color:var(--ink);background:var(--paper)}
b,strong,h1,h2,h3{font-weight:400}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button,a,summary,.switch{touch-action:manipulation}
button,summary,.switch{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
a{color:var(--ink)}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:720px;margin:0 auto;padding:0 max(14px,env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}

/* motion: one hop when results arrive, a floating mascot and plane; all off for reduced motion */
.float{animation:float 3.4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.drift{animation:drift 9s ease-in-out infinite alternate}
.drift.d2{animation-duration:12s;animation-delay:-4s}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
.flow{stroke-dasharray:6 9;animation:flow 1.4s linear infinite}
@keyframes flow{to{stroke-dashoffset:-15}}
.sway{animation:sway 3.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .45s}

/* login */
.login{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 18px}
.lcard{width:100%;max-width:360px;text-align:center}
.lcard .pic{border:var(--line);border-radius:26px;background:var(--water-t);padding:18px 0 8px;margin-bottom:16px;overflow:hidden}
.lcard .pic svg{width:150px;height:auto;margin:0 auto}
.lcard h1{font-size:27px;margin:0 0 2px}
.lcard p{margin:0 0 14px;font-size:14px}
.lcard .err{min-height:22px;margin:10px 0 0;font-size:14px;color:#A33A2A}

/* sign in / sign up */
.atabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 10px}
.atabs button{border:var(--line);border-radius:999px;background:var(--paper);font-size:17px;padding:2px 0;transition:transform .12s ease-out}
.atabs button[aria-selected=true]{background:var(--coral)}
.atabs button:active{transform:scale(.96)}
.aform{border:var(--line);border-radius:var(--r);padding:14px;background:var(--yellow-t);text-align:left;display:grid;gap:10px}
.aform p{margin:0}
.aform .err{margin:0;min-height:0;text-align:center}
.aform .err:empty{display:none}
.pwf{padding-right:70px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;line-height:24px;padding:0 10px}
.hint{font-size:13px;color:var(--ink2)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check .box{width:24px;height:24px;flex:0 0 24px;border:var(--line);border-radius:8px;background:var(--paper);display:grid;place-content:center}
.check input:checked+.box{background:var(--green)}
.check input:checked+.box::after{content:"";width:10px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.check input:focus-visible+.box{outline:3px solid var(--water);outline-offset:2px}
.abtn{border:var(--line);border-radius:999px;background:var(--coral);font-size:18px;padding:6px 0;transition:transform .12s ease-out}
.abtn:active{transform:scale(.97)}
.abtn[disabled]{opacity:.6}
.linkish{justify-self:center;border:0;background:none;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.rf-t{font-size:15px;text-align:center;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;max-width:calc(100% - 32px);border:var(--line);border-radius:999px;background:var(--green);padding:5px 18px;font-size:15px;text-align:center;animation:pop .35s var(--pop)}

/* my account and admin pages */
.vhead{display:flex;align-items:center;gap:10px;margin:16px 0 4px}
.vhead h2{flex:1;font-size:23px;margin:0}
.back{border:var(--line);border-radius:999px;background:var(--paper);padding:1px 12px;font-size:15px;text-decoration:none;white-space:nowrap;transition:transform .12s ease-out}
.back:active{transform:scale(.95)}
.acard{border:var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:12px 0;background:var(--paper)}
.acard.y{background:var(--yellow-t)}
.acard.w{background:var(--water-t)}
.acard.c{background:var(--coral-t)}
.acard h3{font-size:19px;margin:0 0 8px}
.acard form{display:grid;gap:10px}
.acard .btn{justify-self:start}
.note0{font-size:13px;color:var(--ink2);margin:0 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:2px dashed var(--ink);font-size:15px}
.kv span{color:var(--ink2);white-space:nowrap}
.kv b{text-align:right;word-break:break-all}
.acard .kv:last-of-type{margin-bottom:10px}
.rowi{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px dashed var(--ink)}
.rowi:last-of-type{border-bottom:0}
.rowi .main{flex:1;min-width:0}
.rowi .main b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:15px;word-break:break-all}
.rowi .main small{display:flex;flex-wrap:wrap;gap:0 12px;font-size:12px;color:var(--ink2)}
.rowi .icode{font-size:18px;letter-spacing:2px;font-variant-numeric:tabular-nums}
.rowi .icode.old{font-size:13px;letter-spacing:0;font-weight:normal;color:var(--ink2)}
.rowi .who{display:block;font-size:14px;margin:1px 0 2px;word-break:break-all}
.rowi .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rowi .btn{font-size:13px;padding:1px 10px}
.rowi.col{flex-wrap:wrap}
.rowi.col .acts{flex-basis:100%;justify-content:flex-start}
.rowi .out{flex-basis:100%}
.rowi .out:empty{display:none}
.btn.ghost{background:var(--paper)}
.btn.warn{background:var(--coral)}
.tag.me,.tag.own{background:var(--yellow)}
.tag.off{background:var(--coral-t)}
.msg{font-size:14px;margin:0}
.msg:empty{display:none}
.msg.ok{color:#2F6B2F}
.msg.bad{color:#A33A2A}
.invnew{display:flex!important;align-items:flex-end;gap:8px}
.invnew .field{flex:1}
.codebox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;border:3px dashed var(--ink);border-radius:18px;padding:10px 12px;background:var(--paper);margin:10px 0}
.codebox .code{font-size:26px;letter-spacing:3px;font-variant-numeric:tabular-nums}
.codebox input{flex:1;min-width:0;font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:3px 8px;background:var(--paper)}
.codebox small{flex-basis:100%;font-size:12px;color:var(--ink2)}
details.danger summary{cursor:pointer;list-style:none;font-size:17px}
details.danger summary::-webkit-details-marker{display:none}
details.danger[open] summary{margin-bottom:8px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-top:7px solid var(--water);border-bottom:var(--line)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left))}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-size:19px;min-width:0;white-space:nowrap}
.brand .logo{width:38px;height:38px;flex:0 0 38px}
/* today's seats.aero calls: 已用 XXX/1000 over a bar (green, yellow from 70%, coral from 90%) */
.quota{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:92px;border:2px solid var(--ink);border-radius:12px;padding:2px 8px 5px;background:var(--paper);white-space:nowrap;font-size:12px;line-height:1.2;text-align:left;transition:transform .12s ease-out}
.quota:active{transform:scale(.95)}
.quota .qt b{font-weight:normal;font-size:14px;font-variant-numeric:tabular-nums}
.qbar{display:block;height:8px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.qbar i{display:block;width:0;height:100%;background:var(--green);transition:width .5s var(--pop)}
.quota.warn .qbar i{background:var(--yellow)}
.quota.bad .qbar i{background:var(--coral)}
@media (max-width:359px){.brand span{display:none}}
.icon-btn{border:var(--line);background:var(--paper);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;padding:0;transition:transform .12s ease-out}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:18px;height:18px}

/* search card */
.card{background:var(--paper);border:var(--line);border-radius:var(--r);padding:12px 12px 36px;margin:14px 0 36px;position:relative}
.hero{border:var(--line);border-radius:16px;background:var(--water-t);overflow:hidden;margin-bottom:10px}
.hero svg{width:100%;height:auto}
/* the route row and the date row share one 3-column grid, so 出發 sits over 最早出發 and 抵達 over 最晚出發 */
.route{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:6px;align-items:stretch}
.field{position:relative;border:var(--line);border-radius:16px;padding:4px 10px 5px;min-width:0;background:var(--paper)}
.field:focus-within{background:var(--water-t)}
.field label{display:block;font-size:12px;color:var(--ink2);line-height:1.35}
.field input{display:block;border:0;outline:0;width:100%;min-width:0;padding:0;background:transparent;font-size:17px;-webkit-appearance:none;appearance:none;border-radius:0}
.ap input{font-size:clamp(18px,5.6vw,24px);line-height:1.3;text-transform:uppercase;letter-spacing:.5px}
.ap input::placeholder{font-size:16px;letter-spacing:0;text-transform:none;color:#A39C98}
.names{font-size:12px;color:var(--ink2);height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* the middle column is a plain arrow, not a button: one way, or both ways when 來回 is on */
.dir{align-self:center;display:grid;place-items:center}
.tt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-width:220px;margin:0 auto 10px}
.tt button{border:var(--line);border-radius:999px;background:var(--paper);font-size:15px;padding:2px 0;transition:transform .12s ease-out}
.tt button:active{transform:scale(.95)}
.tt button[aria-checked=true]{background:var(--yellow)}
/* round trip: one tab per direction, with each direction's lowest miles */
.legs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0 6px}
.legs button{border:var(--line);border-radius:16px;background:var(--paper);text-align:left;padding:5px 10px 6px;line-height:1.3;min-width:0}
.legs button[aria-selected=true]{background:var(--water)}
.legs button b{display:block;font-size:15px;font-weight:normal;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs small{display:block;font-size:12px;color:var(--ink2)}
.legs .sum2{grid-column:1/-1;font-size:14px;margin:0 2px}
.switch.opt{margin:6px 0}
.switch.opt small{display:block;font-size:11px;color:var(--ink2)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--paper);border:var(--line);border-radius:18px;z-index:15;max-height:300px;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;animation:pop .3s var(--pop)}
.sugg button{display:flex;width:100%;gap:10px;align-items:baseline;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:2px dashed var(--ink)}
.sugg button:last-child{border-bottom:0}
.sugg button:active{background:var(--yellow-t)}
.sugg b{flex:0 0 auto;min-width:76px;font-size:15px;letter-spacing:.5px}
.sugg span{color:var(--ink2);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dates{display:grid;grid-template-columns:minmax(0,1fr) 40px minmax(0,1fr);gap:6px;margin-top:8px}
.dates .to{align-self:center;text-align:center;font-size:15px}
/* the date fields show a short "11/1 (日)" label; the real date input sits on top, invisible, so a tap opens the iPhone picker */
.df{cursor:pointer}
.df label small{font-size:11px;margin-left:4px}
.df .dv{display:block;font-size:clamp(16px,5vw,19px);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.df input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
input[type=date]{min-height:26px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.months{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;margin:10px 0 0;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.months::-webkit-scrollbar{display:none}
.mchip{flex:0 0 auto;min-width:66px;text-align:center;border:var(--line);border-radius:999px;background:var(--paper);padding:1px 12px;font-size:15px;white-space:nowrap;transition:transform .12s ease-out}
.mchip:active{transform:scale(.95)}
.mchip small{font-size:11px;margin-right:3px;color:var(--ink2)}
.mchip.on{background:var(--yellow)}
.ferr{color:#A33A2A;font-size:14px;margin:8px 0 0}
.ferr:empty{display:none}
/* 46px tall and 24.5px below the padding edge, so its middle sits on the middle of the card's 3px bottom border */
.go{position:absolute;left:50%;bottom:-24.5px;height:46px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;border:var(--line);border-radius:999px;background:var(--coral);font-size:19px;line-height:1;padding:0 26px 0 20px;white-space:nowrap;transition:transform .12s ease-out}
.go:active{transform:translateX(-50%) scale(.95)}
.go[disabled]{background:var(--coral-t)}
.go svg{width:22px;height:22px}

/* recent searches */
.recent{display:flex;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;margin:-8px -14px 8px;padding:0 14px 4px;scrollbar-width:none}
.recent::-webkit-scrollbar{display:none}
.recent button{flex:0 0 auto;border:2px dashed var(--ink);border-radius:999px;background:var(--paper);font-size:13px;padding:2px 12px;white-space:nowrap}
.recent button:active{background:var(--yellow-t)}

/* results */
#results{scroll-margin-top:calc(var(--hh) + 6px);animation:pop .5s var(--pop)}
#banner.sticky{position:sticky;top:var(--hh);z-index:6;background:var(--paper);padding-top:4px}
.banner{border:var(--line);border-radius:18px;padding:10px 14px;margin:10px 0;background:var(--yellow-t);font-size:14px}
.banner.bad{background:var(--coral-t)}
.banner.demo{display:flex;align-items:center;gap:8px;margin:4px 0 6px;padding:6px 10px;background:var(--yellow)}
.banner.demo .acts{margin:0 0 0 auto;flex:0 0 auto}
.banner.demo .btn{margin:0;padding:1px 12px}
.demo-on .dh{top:calc(var(--hh) + var(--bh,0px))}
.banner b{display:block;font-size:17px;margin-bottom:2px}
.banner.demo b{display:inline;font-size:15px;margin:0 6px 0 0}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-block;border:var(--line);border-radius:999px;background:var(--water);padding:3px 14px;font-size:15px;text-decoration:none;transition:transform .12s ease-out}
.btn:active{transform:scale(.95)}
.btn.pri{background:var(--coral)}
.route-h{font-size:30px;letter-spacing:1px;line-height:1.2;margin:8px 0 2px;overflow-wrap:anywhere}
.route-h .ar{display:inline-block;width:34px;height:22px;margin:0 6px;vertical-align:-1px}
.sum{font-size:15px}
.fresh{font-size:12px;color:var(--ink2);margin:2px 0 0}
.fresh:empty{display:none}

/* filters: they work on rows already downloaded, so changing them costs no API call */
.filters{border:var(--line);border-radius:var(--r);padding:12px;margin:12px 0 16px;background:var(--green-t)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:var(--line);border-radius:16px;background:var(--paper);padding:4px 0 3px;line-height:1.3;font-size:16px;transition:transform .12s ease-out}
.seg button:active{transform:scale(.95)}
.seg button[aria-checked=true]{background:var(--coral)}
.seg .n{display:block;font-size:12px;min-height:16px;font-variant-numeric:tabular-nums}
.lbl{font-size:13px;margin:12px 0 5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:var(--line);border-radius:999px;background:var(--paper);padding:1px 11px;font-size:15px;transition:transform .12s ease-out}
.chip:active{transform:scale(.95)}
.chip .dot{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:var(--yellow)}
.al4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.al4 .chip{justify-content:center;padding:2px 4px;white-space:nowrap;opacity:.55}
.al4 .chip[aria-pressed=true]{background:var(--c);opacity:1}
.al4 .chip[aria-pressed=true] .dot{background:var(--paper)}
.al4 .chip[aria-pressed=false] .dot{background:var(--c)}
.al4 .chip.part{opacity:1;border-style:dashed;background:var(--paper)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.switch{display:flex;align-items:center;gap:8px;font-size:15px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:46px;height:26px;border:var(--line);border-radius:999px;background:var(--paper);position:relative;flex:0 0 46px;transition:background .2s}
.switch .tr::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .25s var(--pop)}
.switch input:checked+.tr{background:var(--green)}
.switch input:checked+.tr::after{transform:translateX(20px)}
.switch input:focus-visible+.tr{outline:3px solid var(--water);outline-offset:2px}
details.progs{margin-top:12px;border:var(--line);border-radius:18px;background:var(--paper)}
details.progs summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:15px;cursor:pointer}
details.progs summary::-webkit-details-marker{display:none}
details.progs summary::after{content:"＋";margin-left:4px}
details.progs[open] summary::after{content:"－"}
details.progs summary #prog-sum{margin-left:auto;color:var(--ink2);font-size:13px;text-align:right}
.pl{padding:0 12px 12px}
.pl .field{margin:2px 0 4px}
.tfh{font-size:15px;margin:12px 0 0;padding-top:8px;border-top:2px dashed var(--ink)}
.tfh:first-child{border-top:0;padding-top:0;margin-top:4px}
#tf .lbl{margin:10px 0 4px}
#tf .chip{font-size:14px;padding:0 10px}
#tf .chip small{font-size:11px;margin-left:3px;color:var(--ink2)}
#tf .chip[data-tf=noVia][aria-pressed=true]{background:var(--coral-t);text-decoration:line-through}
.tfc{margin:6px 0 2px;font-size:13px;padding:1px 12px}
.cash{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px;padding-top:10px;border-top:2px dashed var(--ink)}
.cpp{display:inline-flex;align-items:center;gap:4px;font-size:14px}
.cpp input{width:84px;font-size:16px;border:2px solid var(--ink);border-radius:10px;padding:1px 6px;background:var(--paper)}
.cppv{font-size:14px;flex-basis:100%}
.cppv:empty{display:none}
.pgh{display:flex;align-items:center;gap:6px;font-size:13px;margin:12px 0 4px}
.pgh .dot{width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;background:var(--c)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 10px}
.pi{display:flex;align-items:center;gap:6px;font-size:14px;padding:4px 0;min-width:0}
.pi input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:0 0 22px;border:var(--line);border-radius:7px;margin:0;display:grid;place-content:center;background:var(--paper);cursor:pointer}
.pi input:checked{background:var(--green)}
.pi input:checked::after{content:"";width:9px;height:5px;border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateY(-2px) rotate(-45deg)}
.pi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pi small{color:var(--ink2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.pi em{font-style:normal;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 6px;background:var(--green);line-height:1.3}
.pi em:empty{display:none}

/* calendar: the one bold element of the page */
.cal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 18px;margin:4px 0 6px}
.mh{font-size:18px;margin:0 0 6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:12px;text-align:center;padding-bottom:2px}
.day{border:2px solid var(--ink);border-radius:12px;min-height:48px;padding:3px 0 2px;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;position:relative;line-height:1.2;min-width:0;transition:transform .12s ease-out}
.day:active{transform:scale(.92)}
.day .dn{font-size:12px;font-variant-numeric:tabular-nums}
.day .dm{font-size:13px;white-space:nowrap;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.day.none{border:2px dashed #CFC8C3;color:#A39C98}
.day.good{background:var(--green-t)}
/* every cell keeps a 2px border so the numbers in a row line up; emphasis is drawn inside with a shadow */
.day.best{background:var(--green);box-shadow:inset 0 0 0 1px var(--ink)}
.day.dir::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.day.sel{background:var(--coral);box-shadow:inset 0 0 0 1px var(--ink);animation:pop .35s var(--pop)}
.day.out{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;margin:6px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border:2px solid var(--ink);border-radius:4px;vertical-align:-3px;margin-right:4px}
.sortbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 4px;font-size:14px}
.sortbar .chip{padding:0 10px;font-size:14px}
.sortbar .chip[aria-pressed=true]{background:var(--water)}
.dayf{background:var(--coral)!important}

/* list of offers */
.dh{position:sticky;top:var(--hh);z-index:4;background:var(--paper);margin:0;padding:12px 2px 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.dh::before{content:"";width:14px;height:14px;flex:0 0 14px;border:3px solid var(--ink);border-radius:50%;background:var(--water)}
.offer{border:var(--line);border-radius:18px;margin:8px 0;background:var(--paper);overflow:hidden}
.ohead{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px 9px}
.ohead:active{background:var(--yellow-t)}
.o1,.o2,.o3,.o4{display:flex;align-items:baseline;gap:6px;min-width:0}
/* small square airline logos (Google Flights' public image folder) */
.lg{display:inline-block;width:16px;height:16px;object-fit:contain;vertical-align:-3px;margin-right:3px;flex:0 0 16px;align-self:center}
.o1 .lg{width:18px;height:18px;flex-basis:18px;margin:0}
.o4{font-size:14px;margin-top:3px;flex-wrap:wrap;row-gap:2px;font-variant-numeric:tabular-nums}
.o4 b{font-weight:normal;font-size:16px;letter-spacing:.3px}
.o4 sup{font-size:10px;margin-left:1px}
.o4 .du,.o4 .via{color:var(--ink2);font-size:13px}
.o4 .more{margin-left:auto;font-size:12px;color:var(--ink2);white-space:nowrap}
/* on a narrow phone the Chinese name gives way first, then the program name; the miles always stay inside the card */
.o1 .pn{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:2.5em;flex:0 1 auto}
.o1 .pz{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 30 auto}
.al{flex:0 0 auto;font-size:12px;border:2px solid var(--ink);background:var(--c);border-radius:999px;padding:0 7px;line-height:1.35;align-self:center}
.mi{margin-left:auto;font-size:23px;white-space:nowrap;letter-spacing:-.2px;font-variant-numeric:tabular-nums;background:linear-gradient(transparent 62%,var(--yellow) 62%);padding:0 2px}
.mi small{font-size:13px;margin-left:2px}
.o2{font-size:14px;margin-top:3px;flex-wrap:wrap;row-gap:3px}
.o2 .rt{letter-spacing:.5px}
.tag{border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--paper);font-size:12px;line-height:20px}
.tag.d{background:var(--green)}
.tag.nw{background:var(--yellow)}
.tag.dn{background:var(--coral-t)}
/* 收藏 on the home page, and the save button under the route */
.saved{margin:-8px 0 14px}
.saved h3{font-size:15px;font-weight:normal;margin:0 0 6px}
.sv{display:flex;gap:6px;margin:0 0 6px}
.svgo{flex:1;min-width:0;text-align:left;border:var(--line);border-radius:14px;background:var(--paper);padding:5px 12px;font-size:14px;line-height:1.35}
.svgo small{display:block;font-size:11px;color:var(--ink2)}
.svx{flex:0 0 38px;border:var(--line);border-radius:14px;background:var(--paper);font-size:15px}
.saverow{margin:4px 0 6px}
.saverow .btn{font-size:13px;padding:1px 12px}
.saverow .btn[aria-pressed=true]{background:var(--yellow)}
.tx{margin-left:auto;white-space:nowrap;font-size:13px;font-variant-numeric:tabular-nums}
.tx .fx{font-size:11px;color:var(--ink2);margin-left:4px}
.o3{font-size:12px;color:var(--ink2);margin-top:4px}
.o3 .ca{flex:1;min-width:0}
.o3 .fl{white-space:nowrap}
.o3 .age{white-space:nowrap}
.o3 .chev{width:18px;height:18px;flex:0 0 18px;transition:transform .25s var(--pop);align-self:center;color:var(--ink)}
.ohead[aria-expanded=true] .chev{transform:rotate(180deg)}
.trips{border-top:var(--line);background:var(--water-t);padding:4px 12px 12px;font-size:14px;animation:pop .35s var(--pop)}
.trip{padding:10px 0;border-bottom:2px dashed var(--ink)}
.t1{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap;font-size:15px}
.t1 b{font-size:20px;font-variant-numeric:tabular-nums}
.t1 .ap3{font-size:14px;letter-spacing:.5px}
.t1 sup{font-size:11px;color:#A33A2A}
.t1 .t-mi{flex-basis:100%;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
.t2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;margin-top:3px}
.t2 .fn{letter-spacing:.5px}
.segs{margin:8px 0 0 6px;border-left:3px dotted var(--ink);padding-left:12px}
.sg{margin:4px 0}
.sg1{font-size:14px;font-variant-numeric:tabular-nums}
.sg1 b{margin-right:8px}
.sg2{display:flex;flex-wrap:wrap;gap:0 10px;font-size:12px;color:var(--ink2)}
.lay{display:inline-block;font-size:12px;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--coral-t);margin:6px 0}
.book{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tload,.tnone,.terr,.tmore{padding:10px 0}
.terr{color:#A33A2A}
.empty{border:3px dashed var(--ink);border-radius:var(--r);padding:14px 16px 16px;text-align:center;background:var(--green-t);margin:8px 0}
.empty svg{width:54px;height:54px;margin:0 auto 6px}
.empty .chips{justify-content:center;margin-top:10px}
.more-btn{display:block;margin:14px auto;border:var(--line);border-radius:999px;background:var(--water);padding:3px 18px;font-size:15px;transition:transform .12s ease-out}
.more-btn:active{transform:scale(.95)}
.skel{height:78px;border:3px dashed #CFC8C3;border-radius:18px;margin:8px 0;background:linear-gradient(90deg,var(--paper) 25%,var(--yellow-t) 37%,var(--paper) 63%);background-size:400% 100%;animation:sk 1.3s ease infinite}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.note{font-size:12px;color:var(--ink2);margin:16px 0 0}
@media (hover:hover) and (pointer:fine){
  .sugg button:hover,.ohead:hover{background:var(--yellow-t)}
  .chip:hover,.mchip:hover,.recent button:hover{background:var(--yellow-t)}
  .btn:hover,.more-btn:hover,.go:hover{filter:brightness(1.04)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.route-h .ar svg{width:100%;height:100%}
</style>
</head>
<body>

<section id="login" class="login" hidden>
  <div class="lcard">
    <div class="pic" aria-hidden="true"><svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M0 66q30-10 60 0t60 0v14H0z" fill="#B9DAA5"/><g class="float"><path d="M46 12v6"/><circle cx="46" cy="11" r="1.6" fill="#3E3A39"/><rect x="32" y="18" width="28" height="24" rx="9" fill="#F2A497"/><circle cx="40.5" cy="28" r="4.2" fill="#F6D27A"/><circle cx="51.5" cy="28" r="4.2" fill="#F6D27A"/><path d="M42.5 36q3.5 3 7 0"/><path d="M37 50l3-5M55 50l-3-5"/></g><g class="sway"><rect x="68" y="34" width="22" height="18" rx="4" fill="#F6D27A"/><path d="M72 34v-6a7 7 0 0 1 14 0v6"/><circle cx="79" cy="42" r="2.4" fill="#3E3A39"/><path d="M79 44v4"/></g></g></svg></div>
    <h1>里程機位搜尋</h1>
    <p id="lsub">用 Email 登入。新帳號要有邀請碼。</p>
    <div class="atabs" id="atabs" role="tablist" aria-label="登入或註冊">
      <button type="button" role="tab" id="tab-in" aria-selected="true">登入</button>
      <button type="button" role="tab" id="tab-up" aria-selected="false">註冊</button>
    </div>
    <form id="af" class="aform" novalidate>
      <div class="field"><label for="em">Email</label><input id="em" type="email" inputmode="email" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next"></div>
      <div class="field pwf"><label for="pw">密碼</label><input id="pw" type="password" autocomplete="current-password" enterkeyhint="go"><button type="button" class="eye" data-for="pw" aria-pressed="false">顯示</button></div>
      <p class="hint" id="pw-hint" hidden>至少 10 個字。可以直接用 iPhone 建議的強密碼。</p>
      <div class="field" id="inv-f" hidden><label for="inv">邀請碼</label><input id="inv" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="例：ABCDE-FGHJK"></div>
      <label class="check"><input type="checkbox" id="rem" checked><span class="box"></span><span>記住我（30 天內不用再登入）</span></label>
      <button class="abtn" id="ago" type="submit">登入</button>
      <p class="err" id="lerr" role="alert"></p>
      <button type="button" class="linkish" id="forgot">忘記密碼？</button>
      <p class="hint" id="forgot-t" hidden>請管理員到「管理」頁幫你產生重設連結，連結 30 分鐘內有效。</p>
    </form>
    <form id="rf" class="aform" hidden novalidate>
      <p class="rf-t">幫這個帳號設定新密碼：<br><b id="rf-email"></b></p>
      <input type="email" id="rf-user" class="sr" autocomplete="username" tabindex="-1" aria-hidden="true">
      <div class="field pwf"><label for="rpw">新密碼（至少 10 個字）</label><input id="rpw" type="password" autocomplete="new-password" enterkeyhint="go"><button type="button" class="eye" data-for="rpw" aria-pressed="false">顯示</button></div>
      <button class="abtn" id="rgo" type="submit">設定新密碼並登入</button>
      <p class="err" id="rerr" role="alert"></p>
      <button type="button" class="linkish" id="rback">回到登入</button>
    </form>
  </div>
</section>

<div id="app" hidden>
  <header class="top"><div class="in">
    <div class="brand">
      <svg class="logo float" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g fill="none" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M20 3v6"/><circle cx="20" cy="3" r="1.5" fill="#3E3A39"/><rect x="6" y="9" width="28" height="24" rx="9" fill="#F2A497"/><circle cx="14.5" cy="19" r="4.2" fill="#F6D27A"/><circle cx="25.5" cy="19" r="4.2" fill="#F6D27A"/><path d="M16.5 27q3.5 3 7 0"/><path d="M11 38l3-5M29 38l-3-5"/></g></svg>
      <span>里程機位搜尋</span>
    </div>
    <button type="button" id="quota" class="quota" hidden><span class="qt"></span><span class="qbar" aria-hidden="true"><i></i></span></button>
    <button id="acct-btn" class="icon-btn" type="button" aria-label="我的帳號" title="我的帳號"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#3E3A39" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 21c1-4.2 4.1-6.5 7.5-6.5s6.5 2.3 7.5 6.5z" fill="#A8D3E6"/><circle cx="12" cy="8.5" r="4.2" fill="#F6D27A"/></g></svg></button>
  </div></header>

  <main class="wrap">
    <div id="view-search">
    <form id="sf" class="card" autocomplete="off" novalidate>
      <div class="hero" aria-hidden="true"><svg viewBox="0 0 320 96" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#3E3A39" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><circle cx="284" cy="24" r="11" fill="#F6D27A"/><g class="drift"><path d="M92 36h26a8 8 0 0 0-3-15 10 10 0 0 0-19-2 7 7 0 0 0-4 17z" fill="#FFFCF6"/></g><g class="drift d2"><path d="M222 45h20a6 6 0 0 0-2-11 8 8 0 0 0-15-2 6 6 0 0 0-3 13z" fill="#FFFCF6"/></g><path class="flow" d="M60 66Q150 -8 262 74" stroke-width="2.5"/><path d="M0 84q40-14 80-4t80 2 80-6 80 4v16H0z" fill="#B9DAA5"/><g transform="translate(250 56)"><path d="M12 26V4"/><g class="sway"><path d="M12 4h12l-3 5 3 5H12z" fill="#F2A497"/></g></g><g transform="translate(130 2)"><g class="float"><path d="M24 30l38-12c4-1 6 3 2 5L32 38z" fill="#FFFCF6"/><path d="M40 24l-6-12h7l11 9" fill="#F2A497"/><path d="M42 32l-2 12h7l7-14" fill="#F2A497"/><path d="M26 31l-4-7"/></g></g><g transform="translate(22 40)"><g class="float"><path d="M20 3v6"/><circle cx="20" cy="3" r="1.5" fill="#3E3A39"/><rect x="6" y="9" width="28" height="24" rx="9" fill="#F2A497"/><circle cx="14.5" cy="19" r="4.2" fill="#F6D27A"/><circle cx="25.5" cy="19" r="4.2" fill="#F6D27A"/><path d="M16.5 27q3.5 3 7 0"/><path d="M11 38l3-5M29 38l-3-5"/></g></g></g></svg></div>
      <div class="tt" id="tt" role="radiogroup" aria-label="單程或來回"><button type="button" role="radio" data-tt="ow" aria-checked="true">單程</button><button type="button" role="radio" data-tt="rt" aria-checked="false">來回</button></div>
      <div class="route" id="route">
        <div class="field ap">
          <label for="from">出發</label>
          <input id="from" placeholder="例：TPE" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="next">
          <div class="names" id="from-names"></div>
        </div>
        <span class="dir" id="dir" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M3.5 12h16M13.5 6l6 6-6 6" fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <div class="field ap">
          <label for="to">抵達</label>
          <input id="to" placeholder="例：SEA" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done">
          <div class="names" id="to-names"></div>
        </div>
        <div class="sugg" id="sugg" hidden></div>
      </div>
      <div class="dates">
        <div class="field df"><label for="d1">最早出發<small id="d1y"></small></label><span class="dv" id="d1v"></span><input type="date" id="d1"></div>
        <span class="to" aria-hidden="true">到</span>
        <div class="field df"><label for="d2">最晚出發<small id="d2y"></small></label><span class="dv" id="d2v"></span><input type="date" id="d2"></div>
      </div>
      <div class="dates" id="rdates" hidden>
        <div class="field df"><label for="r1">回程最早<small id="r1y"></small></label><span class="dv" id="r1v"></span><input type="date" id="r1"></div>
        <span class="to" aria-hidden="true">到</span>
        <div class="field df"><label for="r2">回程最晚<small id="r2y"></small></label><span class="dv" id="r2v"></span><input type="date" id="r2"></div>
      </div>
      <div class="months" id="months"></div>
      <p class="ferr" id="ferr" role="alert"></p>
      <button class="go" id="go" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#3E3A39" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6" fill="#FFFCF6"/><path d="M15 15l5 5"/></g></svg><span id="go-t">搜尋</span></button>
    </form>

    <div class="saved" id="saved" hidden></div>
    <div class="recent" id="recent"></div>

    <section id="results" hidden>
      <div id="banner"></div>
      <div class="legs" id="legs" hidden></div>
      <div class="route-h" id="route-h"></div>
      <div class="saverow"><button type="button" class="btn ghost" id="save-btn" hidden>☆ 收藏這個搜尋</button></div>
      <div class="sum" id="sum" aria-live="polite"></div>
      <div class="fresh" id="fresh"></div>

      <div class="filters" id="filters" hidden>
        <div class="seg" id="cabins" role="radiogroup" aria-label="艙等"></div>
        <div class="lbl">用哪個聯盟的里程</div>
        <div class="chips al4" id="alliances"></div>
        <div class="frow">
          <label class="switch"><input type="checkbox" id="direct"><span class="tr"></span><span>只看直飛</span></label>
        </div>
        <details class="progs" id="progs">
          <summary><span>更多篩選</span><span id="prog-sum"></span></summary>
          <div class="pl">
            <div class="tfh">航班條件</div>
            <div id="tf"></div>
            <div class="field"><label for="maxmi">最多里程</label><input id="maxmi" inputmode="numeric" placeholder="不限，例：80000" autocomplete="off" enterkeyhint="done"></div>
            <button type="button" class="btn ghost tfc" id="tf-clear" hidden>清除航班條件</button>
            <div class="tfh">搜尋選項（改了要重新搜尋）</div>
            <label class="switch opt"><input type="checkbox" id="opt-mixed"><span class="tr"></span><span>包含混艙<small>至少一半航程在這個艙等</small></span></label>
            <label class="switch opt"><input type="checkbox" id="opt-dyn"><span class="tr"></span><span>包含動態高價位子<small>seats.aero 預設會藏起來</small></span></label>
            <button type="button" class="btn ghost tfc" id="opt-rerun" hidden>用新選項重新搜尋</button>
            <div class="tfh">航空公司和里程計畫</div>
            <div class="field"><label for="carriers">實際搭乘的航空公司（代碼）</label><input id="carriers" placeholder="不限，例：BR,DL" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="done"></div>
            <div id="prog-list"></div>
          </div>
        </details>
      </div>

      <div class="cal" id="cal"></div>
      <div class="legend" id="legend" hidden><span><i style="background:var(--green)"></i>最便宜</span><span><i style="background:var(--green-t)"></i>便宜</span><span><i style="background:var(--paper)"></i>有位</span><span>右上小點代表有直飛</span></div>

const pad = x => String(x).padStart(2, '0');

  if (m < 10000) return fmtMiles(m);
  const v = m / 10000;
  return (v >= 100 ? Math.round(v) : Math.round(v * 10) / 10) + '萬';
}
function money(v, cur) {
  if (cur) {
    const d = v >= 100 ? 0 : 2;
    // zh-TW writes its own currency as a bare "$", which reads as US dollars here
    if (cur === 'TWD') return 'NT$' + v.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
    try { return new Intl.NumberFormat('zh-TW', { style: 'currency', currency: cur, minimumFractionDigits: d, maximumFractionDigits: d }).format(v); } catch {}
    return cur + ' ' + v.toFixed(d);
  }
  return '稅 ' + v.toFixed(2);
}
function ago(ts) {
  const t = Date.parse(ts);
  if (!t) return '';
  const m = Math.max(0, (Date.now() - t) / 60000);
  if (m < 60) return Math.max(1, Math.round(m)) + ' 分鐘前更新';
  if (m < 2880) return Math.round(m / 60) + ' 小時前更新';
  return Math.round(m / 1440) + ' 天前更新';
}
function dur(min) {
  min = Math.round(min || 0);
  if (min <= 0) return '';
  const h = Math.floor(min / 60), m = min % 60;
  return (h ? h + ' 小時' : '') + (h && m ? ' ' : '') + (m ? m + ' 分' : '');
}

async function loadFx() {
  const day = isoDate(new Date());

  try {
    const list = await (await fetch('https://api.frankfurter.dev/v2/rates?base=USD')).json();
    const rates = { USD: 1 };
    for (const x of list) if (x.quote && x.rate > 0) rates[x.quote] = x.rate;
    FX = { day, rates };
    save('award-fx', FX);
    return true;
  } catch { return false; }   // keep the last rates, or none
}

const getToken = () => localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY) || '';
function setToken(t, remember) {
  clearToken();
  (remember ? localStorage : sessionStorage).setItem(TOKEN_KEY, t);
}
function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem('award-token');   // the old single-password token
}
// A JSON request to the Worker. Throws ApiError carrying the Chinese message for its error code.
async function call(method, path, body) {
  const headers = { 'Content-Type': 'application/json' };
  if (getToken()) headers.Authorization = 'Bearer ' + getToken();
  let r;
  try {
    r = await fetch(RELAY + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch {
    throw new ApiError('network', '連不上伺服器，請檢查網路。');
  }
  const b = await r.json().catch(() => ({}));
  if (r.ok) return b;
  let msg = ERR[b.error] || '出了點問題（HTTP ' + r.status + '）。';
  if (b.error === 'login' && b.left > 0 && b.left < 5) msg += '再錯 ' + b.left + ' 次，這個帳號會鎖 15 分鐘。';
  if (b.error === 'auth' && !path.startsWith('/auth/')) logout(ERR.auth, false);
  throw new ApiError(b.error || 'http', msg);
}

/* ---------- API ---------- */
class ApiError extends Error { constructor(kind, msg) { super(msg); this.kind = kind; } }
async function api(path) {
  let r;
  try {
    r = await fetch(RELAY + path, { headers: { Authorization: 'Bearer ' + getToken() } });
  } catch {
    throw new ApiError('network', '連不上中繼站，請檢查網路後再試一次。');
  }
  const q = r.headers.get('X-RateLimit-Remaining');
  if (q !== null && q !== '' && !isNaN(q)) setQuota(Number(q), Number(r.headers.get('X-RateLimit-Limit')) || 1000, Date.now());
  const text = await r.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (r.ok) {
    if (!body) throw new ApiError('bad', 'seats.aero 回傳的資料看不懂，等一下再試。');
    return body;
  }
  if (body && body.error === 'auth') { logout(ERR.auth, false); throw new ApiError('auth', ERR.auth); }
  if (body && body.error === 'param') throw new ApiError('param', '搜尋條件的格式不對。');
  const t = text.toLowerCase();
  if (t.includes('subscription_expired')) throw new ApiError('expired', 'seats.aero 的 Pro 訂閱已經過期，續訂之後才查得到。');
  if (r.status === 429) throw new ApiError('quota', '今天的 1,000 次查詢額度用完了，' + resetText() + '重置。');
  if (t.includes('partner_key') || r.status === 401 || r.status === 403) throw new ApiError('key', 'seats.aero 不接受這把 API key（' + text.slice(0, 40) + '），需要重新產生一把。');
  throw new ApiError('upstream', 'seats.aero 暫時有問題（HTTP ' + r.status + '），等一下再試。');
}
// Today's seats.aero calls as 已用 XXX/1000. The count comes from seats.aero itself (X-RateLimit-Remaining), so it
// covers every use of the key, not only this site. The relay also keeps the latest count (GET /quota, no call),
// so a phone and a laptop show the same number. The quota resets at 00:00 UTC.
const lastReset = () => { const d = new Date(); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); };
let Q = load('award-quota2', null);   // { left, limit, at: ms of the reading }
let quotaTimer = 0;
function setQuota(left, limit, at) {
  if (Q && Q.at > at) return;   // keep the newer reading
  Q = { left, limit: limit || 1000, at };
  save('award-quota2', Q);
  showQuota();
}
function quotaUsed() {
  const lim = (Q && Q.limit) || 1000;
  return { lim, used: !Q || Q.at < lastReset() ? 0 : Math.max(0, lim - Q.left) };
}
function showQuota() {
  const el = $('#quota');
  if (!Q) { el.hidden = true; return; }
  const { lim, used } = quotaUsed(), pct = Math.min(100, used / lim * 100);
  el.querySelector('.qt').innerHTML = '已用 <b>' + used.toLocaleString('en-US') + '</b>/' + lim.toLocaleString('en-US');
  el.querySelector('.qbar i').style.width = (used ? Math.max(pct, 4) : 0) + '%';   // a sliver even for a few calls
  el.classList.toggle('warn', pct >= 70 && pct < 90);
  el.classList.toggle('bad', pct >= 90);
  el.setAttribute('aria-label', '今天的 API 額度已用 ' + used + ' 次，共 ' + lim + ' 次');
  el.hidden = false;
  // drop back to 0 at the next UTC midnight if the page is still open
  clearTimeout(quotaTimer);
  quotaTimer = setTimeout(showQuota, lastReset() + 86400000 - Date.now() + 1000);
}
$('#quota').addEventListener('click', () => {
  const { lim, used } = quotaUsed();
  const seen = Q && Q.at >= lastReset() ? '（' + new Date(Q.at).toLocaleTimeString('zh-TW', { hour: 'numeric', minute: '2-digit' }) + ' 的數字）' : '';
  toast('今天已用 ' + used + ' 次，還剩 ' + (lim - used) + ' 次' + seen + '，' + resetText() + '重置');
});

/* ---------- cache ---------- */
const MEM = new Map();
function cacheGet(k) {
  let v = MEM.get(k);
  if (!v) { try { v = JSON.parse(sessionStorage.getItem(k)); } catch {} }
  if (v && Date.now() - v.t < CACHE_MIN * 60000) { MEM.set(k, v); return v; }
  return null;
}
function cacheSet(k, v) {
  MEM.set(k, v);
  try { sessionStorage.setItem(k, JSON.stringify(v)); } catch { /* too big for sessionStorage; memory still has it */ }

/* ---------- results ---------- */
function offersOf(rows, cab, f) {
  const out = [];
  out.noData = 0;   // rows left out only because the 航班條件 need trips the row doesn't have
  for (const r of rows) {
    if (!r[cab + 'Available']) continue;
    const src = r.Source || (r.Route && r.Route.Source);
    if (f.off.has(src)) continue;
    const direct = !!r[cab + 'Direct'];
    if (f.direct && !direct) continue;
    const dmiles = num(r[cab + 'DirectMileageCost']);
    const useD = f.direct && dmiles > 0;
    const miles = useD ? dmiles : num(r[cab + 'MileageCost']);
    if (!miles) continue;
    const pickD = k => (useD && r[cab + 'Direct' + k] != null ? r[cab + 'Direct' + k] : r[cab + k]);
    const airlines = String(pickD('Airlines') || '').split(/[\s,]+/).filter(Boolean);
    if (f.carriers.size && !airlines.some(a => f.carriers.has(a))) continue;
    if (f.maxMiles && miles > f.maxMiles) continue;
    if (f.wd.size && !f.wd.has(parseDate(r.Date).getDay())) continue;
    const seats = num(pickD('RemainingSeats'));
    if (f.pax > 1 && seats && seats < f.pax) continue;   // 0 means the program doesn't say, so keep it
    const bt = bestTrip(r.AvailabilityTrips, CABIN_BY[cab].api, f, miles);
    if (bt.drop) { if (bt.noData) out.noData++; continue; }
    out.push({
      id: r.ID, src, date: r.Date, from: r.Route ? r.Route.OriginAirport : '', to: r.Route ? r.Route.DestinationAirport : '',
      miles, dmiles, direct, taxes: num(pickD('TotalTaxes')), cur: r.TaxesCurrency || '', seats, base: num(r[cab + 'MileageCost']),
      airlines, updated: r.UpdatedAt, trip: bt.trip, more: bt.more,
    });
  }
  return out;
}
const segsOf = t => (t.AvailabilitySegments || []).slice().sort((a, b) => (a.Order || 0) - (b.Order || 0));
const stopsOf = t => { const s = segsOf(t); return s.length ? s.length - 1 : num(t.Stops); };
// The flight a card describes: in this cabin, meeting the filters, at the card's price if one matches, then the
// shortest. trip: the summary the card shows; more: how many other flights qualify; drop: leave the row out.
function bestTrip(trips, api, f, miles) {
  const cabin = (trips || []).filter(t => String(t.Cabin || '').toLowerCase() === api);
  let list = cabin.filter(t => (!f.direct || stopsOf(t) === 0) && tripOK(t, f));
  if (!list.length) return tripRules(f) ? { drop: true, noData: !cabin.length } : { trip: null, more: 0 };
  list.sort((a, b) => (num(a.MileageCost) !== miles) - (num(b.MileageCost) !== miles) || num(a.MileageCost) - num(b.MileageCost) || (a.TotalDuration || 0) - (b.TotalDuration || 0));
  const t = list[0], segs = segsOf(t);
  const flights = (segs.length ? segs.map(s => s.FlightNumber) : String(t.FlightNumbers || '').split(',')).map(x => String(x || '').replace(/\s+/g, '')).filter(Boolean);
  return {
    trip: {
      dep: t.DepartsAt || (segs[0] || {}).DepartsAt || '', arr: t.ArrivesAt || (segs[segs.length - 1] || {}).ArrivesAt || '',
      mins: num(t.TotalDuration), stops: stopsOf(t), via: viaOf(t), flights,
    },
    more: list.length - 1,
  };
}

function renderCalendar(offers) {
  const p = S.params;
  const best = new Map(), dir = new Set();
  for (const o of offers) {
    if (!best.has(o.date) || o.miles < best.get(o.date)) best.set(o.date, o.miles);
    if (o.direct) dir.add(o.date);
  }
  const vals = [...best.values()].sort((a, b) => a - b);
  const min = vals[0] || 0, third = vals[Math.floor((vals.length - 1) / 3)] || 0;
  const level = m => (m <= min * 1.05 ? 'best' : m <= third ? 'good' : 'ok');
  const start = parseDate(p.s), end = parseDate(p.e);
  let h = '';
  for (let y = start.getFullYear(), m = start.getMonth(); y < end.getFullYear() || (y === end.getFullYear() && m <= end.getMonth()); m === 11 ? (y++, m = 0) : m++) {
    h += '<div class="month"><div class="mh">' + y + ' 年 ' + (m + 1) + ' 月</div><div class="grid">' + [...WD].map(w => '<div class="wd">' + w + '</div>').join('');
    const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
    for (let i = 0; i < first; i++) h += '<span class="day out"></span>';
    for (let d = 1; d <= last; d++) {
      const iso = y + '-' + pad(m + 1) + '-' + pad(d);
      if (iso < p.s || iso > p.e) { h += '<span class="day out">' + d + '</span>'; continue; }
      const b = best.get(iso);
      const cls = (b ? level(b) : 'none') + (dir.has(iso) ? ' dir' : '') + (S.day === iso ? ' sel' : '');
      h += '<button type="button" class="day ' + cls + '" data-d="' + iso + '" aria-label="' + md(iso) + (b ? ' 最低 ' + fmtMiles(b) + ' 哩' : ' 沒有位子') + '"><span class="dn">' + d + '</span><span class="dm">' + (b ? fmtMan(b) : '·') + '</span></button>';
    }
    h += '</div></div>';
  }
  $('#cal').innerHTML = h;
  $('#legend').hidden = !offers.length;
}

        '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg></span>' +
    '</button><div class="trips" hidden></div></article>';
}
function renderList(offers, counts) {
  let list = S.day ? offers.filter(o => o.date === S.day) : offers.slice();
  const sort = S.prefs.sort;
  if (sort === 'miles') list.sort((a, b) => a.miles - b.miles || a.date.localeCompare(b.date));
  else if (sort === 'seats') list.sort((a, b) => (b.seats || 0) - (a.seats || 0) || a.miles - b.miles);
  // unknown duration or taxes go last
  else if (sort === 'dur') list.sort((a, b) => ((a.trip && a.trip.mins) || 1e9) - ((b.trip && b.trip.mins) || 1e9) || a.miles - b.miles);
  else if (sort === 'tax') {
    const usd = o => (o.taxes ? toUSD(o.taxes, o.cur) : null) ?? 1e12;   // 0 means the program gave no taxes
    list.sort((a, b) => usd(a) - usd(b) || a.miles - b.miles);
  }
  else list.sort((a, b) => a.date.localeCompare(b.date) || a.miles - b.miles);
  if (!list.length) {
    $('#list').innerHTML = emptyHtml(counts);
    return;
  }
  const shown = list.slice(0, S.shown);
  let h = '', lastDate = '';
  for (const o of shown) {
    if (sort === 'date' && o.date !== lastDate) { h += '<h3 class="dh">' + mdw(o.date) + '</h3>'; lastDate = o.date; }
    h += cardHtml(o, sort !== 'date');
  }
  if (list.length > S.shown) h += '<button type="button" class="more-btn" data-more="1">再顯示 ' + Math.min(60, list.length - S.shown) + ' 筆（還有 ' + (list.length - S.shown) + ' 筆）</button>';
  $('#list').innerHTML = h;
}
function emptyHtml(counts) {
  if (!S.rows.length) return '<div class="empty">' + MASCOT + '這段日期 seats.aero 沒有這條航線的資料。<br>試試附近的機場（例如 TPE 加上 TSA），或換個日期。</div>';
  const others = CABINS.filter(c => c.k !== S.prefs.cabin && counts[c.k]);
  let h = '<div class="empty">' + MASCOT + '' + (S.day ? md(S.day) + ' ' : '') + CABIN_BY[S.prefs.cabin].name + '艙沒有符合條件的位子。';
  if (S.prefs.direct || S.prefs.off.length || filt().carriers.size) h += '<br>可以試著放寬條件：取消只看直飛、多選幾個聯盟，或清空航空公司。';
  if (others.length) h += '<div class="chips">' + others.map(c => '<button type="button" class="chip" data-cab="' + c.k + '">看' + c.name + '（' + counts[c.k] + ' 筆）</button>').join('') + '</div>';

}
$('#list').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) { S.shown += 60; render(); return; }
  const cab = e.target.closest('[data-cab]');
  if (cab) { S.prefs.cabin = cab.dataset.cab; savePrefs(); render(); return; }
  const head = e.target.closest('.ohead');
  if (head) toggleTrips(head.closest('.offer'));
});

/* ---------- trip details ---------- */
async function toggleTrips(art) {
  const box = art.querySelector('.trips'), head = art.querySelector('.ohead');
  const open = box.hidden;
  box.hidden = !open;
  head.setAttribute('aria-expanded', String(open));
  if (!open || box.dataset.loaded) return;
  const id = art.dataset.id, src = art.dataset.src;
  box.innerHTML = '<div class="tload">讀取航班中…</div>';
  try {
    let res = S.trips.get(id);
    if (!res) {
      res = S.demo ? demoTrips(id, src) : await api('/trips/' + encodeURIComponent(id));
      S.trips.set(id, res);
    }
    box.innerHTML = tripsHtml(res, src) + cashHtml(art.dataset);
    box.dataset.loaded = '1';
  } catch (err) {
    box.innerHTML = '<div class="terr">' + esc(err.message) + '</div>';
  }
}
function tripsHtml(res, src) {
  const want = CABIN_BY[S.prefs.cabin].api;
  let trips = (res.data || []).slice();
  const mine = trips.filter(t => String(t.Cabin || '').toLowerCase() === want);
  if (mine.length) trips = mine;
  if (S.prefs.direct) {
    const nonstop = trips.filter(t => (t.AvailabilitySegments || []).length === 1 || t.Stops === 0);
    if (nonstop.length) trips = nonstop;
  }
  trips.sort((a, b) => num(a.MileageCost) - num(b.MileageCost) || (a.TotalDuration || 0) - (b.TotalDuration || 0));
  let h = trips.length ? trips.slice(0, 12).map(tripHtml).join('') : '<div class="tnone">seats.aero 沒有這筆的航班細節。</div>';
  if (trips.length > 12) h += '<div class="tmore">還有 ' + (trips.length - 12) + ' 個航班組合沒有列出。</div>';
  const links = (res.booking_links || []).filter(l => /^https:\/\//i.test(l.link || '')).sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0));
  const p = prog(src);
  h += '<div class="book">' + (links.length
    ? links.map(l => '<a class="btn' + (l.primary ? ' pri' : '') + '" href="' + esc(l.link) + '" target="_blank" rel="noopener">' + esc(l.label || '去訂位') + '</a>').join('')
    : (p.url ? '<a class="btn pri" href="' + esc(p.url) + '" target="_blank" rel="noopener">到 ' + esc(p.name) + ' 官網訂位</a>' : '')) + '</div>';
  return h;
}
// Cash check: Google Flights opened on the same one-way search (its text query, tested 2026-10-14 for economy,
// business and first; it doesn't read "premium economy", so that cabin opens as economy), plus value per mile.
const GF_CABIN = { Y: 'economy', W: 'economy', J: 'business class', F: 'first class' };
function cashHtml(d) {
  const q = 'Flights to ' + d.to + ' from ' + d.from + ' on ' + d.date + ' oneway ' + GF_CABIN[S.prefs.cabin];
  const url = 'https://www.google.com/travel/flights?q=' + encodeURIComponent(q) + '&curr=USD&hl=zh-TW';
  return '<div class="cash"><a class="btn" href="' + esc(url) + '" target="_blank" rel="noopener">Google Flights 看現金價' + (S.prefs.cabin === 'W' ? '（打開後改成豪經）' : '') + '</a>' +
    '<label class="cpp">現金票價 US$<input inputmode="decimal" placeholder="例：2400" data-cpp="1" aria-label="現金票價（美元）"></label><span class="cppv"></span></div>';
}
// value per mile = (cash fare minus the award's taxes) / miles, in US cents
$('#list').addEventListener('input', e => {
  if (!e.target.dataset.cpp) return;
  const art = e.target.closest('.offer'), out = art.querySelector('.cppv'), d = art.dataset;
  const cash = parseFloat(e.target.value.replace(/[^\d.]/g, ''));
  if (!(cash > 0)) { out.textContent = ''; return; }
  const tax = +d.tax ? toUSD(+d.tax, d.cur) : 0;
  const cents = (cash - (tax || 0)) / +d.miles * 100;
  out.textContent = '每哩約 ' + cents.toFixed(2) + ' 美分' + (tax ? '（已扣稅金約 US$' + tax.toFixed(0) + '）' : tax === null ? '（查不到 ' + d.cur + ' 匯率，稅金沒有扣）' : '');
});
function tripHtml(t) {
  const segs = (t.AvailabilitySegments || []).slice().sort((a, b) => (a.Order || 0) - (b.Order || 0));
  const first = segs[0] || {}, last = segs[segs.length - 1] || {};
  const dep = t.DepartsAt || first.DepartsAt, arr = t.ArrivesAt || last.ArrivesAt;
  const plus = dayDiff(dep, arr);
  const stops = segs.length ? segs.length - 1 : num(t.Stops);
  const miles = num(t.MileageCost);
  let h = '<div class="trip"><div class="t1"><b>' + hm(dep) + '</b><span class="ap3">' + esc(first.OriginAirport || '') + '</span> → <b>' + hm(arr) + '</b><span class="ap3">' + esc(last.DestinationAirport || '') + '</span>' +
    dayTag(plus) + '<span class="t-mi">' + (miles ? fmtMiles(miles) + ' 哩' : '') + (t.TotalTaxes ? ' + ' + money(t.TotalTaxes / 100, t.TaxesCurrency) : '') + '</span></div>';
  const bits = ['<span class="fn">' + esc(t.FlightNumbers || '') + '</span>', dur(t.TotalDuration), stops ? '轉機 ' + stops + ' 次' : '直飛'];
  if (num(t.RemainingSeats)) bits.push('剩 ' + num(t.RemainingSeats) + ' 位');
  if (t.MixedCabinPct) bits.push('有 ' + Math.round(t.MixedCabinPct) + '% 航程是較低艙等');
  h += '<div class="t2">' + bits.filter(x => x && x !== '<span class="fn"></span>').map(x => '<span>' + x + '</span>').join('') + '</div>';
  const extra = s => [s.AircraftName && esc(s.AircraftName), s.Cabin && CABIN_ZH[String(s.Cabin).toLowerCase()], s.FareClass && '艙位 ' + esc(s.FareClass)].filter(Boolean).map(x => '<span>' + x + '</span>').join('');
  if (segs.length === 1) {
    if (extra(segs[0])) h += '<div class="sg2">' + extra(segs[0]) + '</div>';
  } else if (segs.length > 1) {
    h += '<div class="segs">';
    segs.forEach((s, i) => {
      if (i) h += '<div class="lay">在 ' + esc(s.OriginAirport) + ' 轉機 ' + dur(minsBetween(segs[i - 1].ArrivesAt, s.DepartsAt)) + '</div>';
      const plusSeg = dayDiff(s.DepartsAt, s.ArrivesAt);
      h += '<div class="sg"><div class="sg1"><b>' + esc(s.FlightNumber || '') + '</b>' + esc(s.OriginAirport) + ' ' + hm(s.DepartsAt) + ' → ' + esc(s.DestinationAirport) + ' ' + hm(s.ArrivesAt) +
        dayTag(plusSeg) + '</div>' + (extra(s) ? '<div class="sg2">' + extra(s) + '</div>' : '') + '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

/* ---------- demo data (clearly fake; only used when the user asks for it) ---------- */
function rng(seed) {
  let h = 2166136261;
  for (let i = 0; i < seed.length; i++) h = Math.imul(h ^ seed.charCodeAt(i), 16777619);
  return () => {
    h = (h + 0x6D2B79F5) | 0;
    let t = Math.imul(h ^ (h >>> 15), 1 | h);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const DEMO_CARRIERS = { star: ['BR', 'UA', 'NH'], oneworld: ['AS', 'CX', 'JL'], skyteam: ['DL', 'CI', 'KE'], none: ['EK', 'EY'] };
const DEMO_HUB = { star: 'NRT', oneworld: 'HKG', skyteam: 'ICN', none: 'DXB' };
function demoRows(p) {
  const rows = [];
  const o = p.o.split(',')[0], d = p.d.split(',')[0];
  const srcs = ['united', 'aeroplan', 'turkish', 'lufthansa', 'alaska', 'american', 'qantas', 'delta', 'flyingblue', 'virginatlantic', 'emirates', 'etihad'];
  for (let t = parseDate(p.s); isoDate(t) <= p.e; t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1)) {
    const date = isoDate(t);
    for (const src of srcs) {
      const r = rng(date + src + o + d);
      if (r() < 0.4) continue;
      const al = PROGRAMS[src][2], cs = DEMO_CARRIERS[al];
      const row = { ID: 'demo' + date.replace(/-/g, '') + src, Route: { OriginAirport: o, DestinationAirport: d, Source: src }, Date: date, Source: src, TaxesCurrency: 'USD',
        UpdatedAt: new Date(Date.now() - r() * 50 * 36e5).toISOString() };
      for (const [k, lo, hi, pr] of [['Y', 25, 45, 0.85], ['W', 45, 75, 0.35], ['J', 60, 130, 0.5], ['F', 110, 190, 0.12]]) {
        const ok = r() < pr, direct = ok && r() < 0.5, cost = Math.round(lo + r() * (hi - lo)) * 1000;
        const taxes = Math.round(560 + r() * 25000), seats = 1 + Math.floor(r() * 6);
        Object.assign(row, {
          [k + 'Available']: ok, [k + 'MileageCost']: ok ? String(cost) : '0', [k + 'Direct']: direct,
          [k + 'DirectMileageCost']: direct ? cost : 0, [k + 'TotalTaxes']: ok ? taxes : 0, [k + 'DirectTotalTaxes']: direct ? taxes : 0,
          [k + 'RemainingSeats']: ok ? seats : 0, [k + 'DirectRemainingSeats']: direct ? seats : 0,
          [k + 'Airlines']: ok ? cs.slice(0, 1 + Math.floor(r() * 2)).join(', ') : '', [k + 'DirectAirlines']: direct ? cs[0] : '',
        });
      }
      row.AvailabilityTrips = demoTripList(row);   // like a real search with include_trips
      rows.push(row);
    }
  }
  return rows;
}
function demoTrips(id) {
  const row = (S.rows || []).find(x => x.ID === id);
  return { data: row ? row.AvailabilityTrips || demoTripList(row) : [], booking_links: [] };
}
function demoTripList(row) {
  const r = rng(row.ID), al = PROGRAMS[row.Source] ? PROGRAMS[row.Source][2] : 'none', cs = DEMO_CARRIERS[al], hub = DEMO_HUB[al];
  const o = row.Route.OriginAirport, d = row.Route.DestinationAirport, data = [];
  // local clock times like the real data (a trailing Z, but each airport's own clock); the shifts pretend
  // TPE is UTC+8, the hub UTC+9 and the destination UTC-7, so they read about right for TPE to SEA
  const base = Date.UTC(+row.Date.slice(0, 4), +row.Date.slice(5, 7) - 1, +row.Date.slice(8));
  const at = (min) => new Date(base + min * 60000).toISOString().slice(0, 19) + 'Z';
  const pick = a => a[Math.floor(r() * a.length)];
  for (const c of CABINS) {
    if (!row[c.k + 'Available']) continue;
    const fn = cs[0] + ' ' + (10 + Math.floor(r() * 90));
    if (row[c.k + 'Direct']) {
      const dep = pick([10 * 60 + 20, 16 * 60 + 55, 23 * 60 + 40]);
      data.push({ Cabin: c.api, MileageCost: num(row[c.k + 'MileageCost']), TotalTaxes: row[c.k + 'TotalTaxes'], TaxesCurrency: 'USD', RemainingSeats: row[c.k + 'RemainingSeats'],
        FlightNumbers: fn, TotalDuration: 650, Stops: 0, Connections: [], Carriers: cs[0], DepartsAt: at(dep), ArrivesAt: at(dep + 650 - 900),
        AvailabilitySegments: [{ FlightNumber: fn.replace(' ', ''), OriginAirport: o, DestinationAirport: d, DepartsAt: at(dep), ArrivesAt: at(dep + 650 - 900), AircraftName: 'Boeing 777-300ER', Cabin: c.api, FareClass: 'I', Order: 0 }] });
    }
    const f1 = cs[0] + (100 + Math.floor(r() * 800)), f2 = cs[cs.length - 1] + (100 + Math.floor(r() * 800));
    const dep = pick([1 * 60 + 5, 8 * 60 + 50, 13 * 60 + 30, 18 * 60 + 15]), lay = pick([95, 225, 480, 760]);
    const a1 = dep + 200 + 60, d2 = a1 + lay, a2 = d2 + 525 - 960;   // 3h20 to the hub, then 8h45 on
    data.push({ Cabin: c.api, MileageCost: num(row[c.k + 'MileageCost']), TotalTaxes: row[c.k + 'TotalTaxes'], TaxesCurrency: 'USD', RemainingSeats: 2,
      FlightNumbers: f1 + ', ' + f2, TotalDuration: 200 + lay + 525, Stops: 1, Connections: [hub], Carriers: [...new Set([f1.slice(0, 2), f2.slice(0, 2)])].join(', '),
      DepartsAt: at(dep), ArrivesAt: at(a2),
      AvailabilitySegments: [
        { FlightNumber: f1, OriginAirport: o, DestinationAirport: hub, DepartsAt: at(dep), ArrivesAt: at(a1), AircraftName: 'Airbus A350-900', Cabin: c.api, FareClass: 'I', Order: 0 },
        { FlightNumber: f2, OriginAirport: hub, DestinationAirport: d, DepartsAt: at(d2), ArrivesAt: at(a2), AircraftName: 'Boeing 787-9', Cabin: c.api, FareClass: 'I', Order: 1 }] });
  }
  return data;
}

/* ---------- start ---------- */
function showApp() {
  $('#login').hidden = true;
  $('#app').hidden = false;
  const hh = () => document.documentElement.style.setProperty('--hh', $('.top').offsetHeight + 'px');
  hh();
  addEventListener('resize', hh);
  showQuota();
  api('/quota').then(q => { if (q.remaining != null) setQuota(q.remaining, q.limit, q.at * 1000); }).catch(() => {});
  route();
  if (location.hash === '#demo' && S.search) runSearch(S.search, true);
  loadFx().then(fresh => { if (fresh && S.rows) render(); });
  loadSaved();
}
function init() {
  renderMonths();

    const p = readForm();

      // show the last results again if they are still in the 15-minute cache (no API call)

      S.params = S.legs[0].p;
      for (const L of S.legs) { const hit = cacheGet(cacheKey(L.p)); if (hit) Object.assign(L, { rows: hit.rows, truncated: hit.truncated, fetchedAt: hit.t }); }
      if (S.legs[0].rows) { $('#results').hidden = false; useLeg(0); }
    }
  } else {
    $('#from').value = 'TPE'; $('#to').value = 'SEA';
    const d = new Date();
    setRange(...monthRange(d.getMonth() === 11 ? d.getFullYear() + 1 : d.getFullYear(), (d.getMonth() + 1) % 12 + 1));
    S.search = S.params = readForm();
  }
  showNames($('#from')); showNames($('#to'));
  localStorage.removeItem('award-token');   // the old single-password token no longer works
  const reset = /^#reset=([A-Za-z0-9_-]{40,64})$/.exec(location.hash);
  if (reset) startReset(reset[1]);
  else if (getToken()) {
    // check the saved session is still valid before showing the app
    call('GET', '/me')
      .then(m => { ME = { email: m.email, role: m.role }; showApp(); })
      .catch(err => { if (err.kind === 'network') showApp(); else if (err.kind !== 'auth') showLogin(err.message); });
  } else showLogin('');
}
